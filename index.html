<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b1020;
  --card:#121a33;
  --accent:#6d5cff;
  --accent2:#8b5cf6;
  --text:#e6e9ff;
  --muted:#94a3b8;
  --green:#22c55e;
  --red:#ef4444;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, Arial;
  background: radial-gradient(circle at 20% 0%, #11183a, #05070f 60%);
  color:var(--text);
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.title{
  font-size:28px;
  font-weight:700;
  background:linear-gradient(90deg,#fff,#a5b4fc);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  margin:15px 0;
}
.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:var(--card);
  cursor:pointer;
  transition:0.2s;
}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

/* BALANCE */
.balance{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--card);
  padding:12px;
  border-radius:12px;
}

.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* CASE (3D-ish) */
.case-box{
  margin-top:30px;
  display:flex;
  justify-content:center;
}
.case{
  width:200px;
  height:200px;
  background:linear-gradient(145deg,#5b21b6,#9333ea);
  border-radius:20px;
  position:relative;
  transform:rotateX(20deg) rotateY(-20deg);
  box-shadow:
    0 20px 40px rgba(139,92,246,0.5),
    inset 0 0 40px rgba(255,255,255,0.1);
}
.case:after{
  content:"Скоро";
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-weight:bold;
}

/* ROCKET GAME */
.game{
  display:none;
}

.multiplier{
  font-size:48px;
  text-align:center;
  margin:10px 0;
}

/* CANVAS */
canvas{
  width:100%;
  height:300px;
  background:black;
  border-radius:12px;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.controls input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
}

/* PLAYERS */
.players{
  margin-top:15px;
  background:var(--card);
  padding:10px;
  border-radius:12px;
  max-height:150px;
  overflow:auto;
  font-size:14px;
}

/* HISTORY */
.history{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.history span{
  padding:5px 8px;
  border-radius:8px;
  background:#1f2a4a;
  font-size:12px;
}
.green{color:var(--green)}
.red{color:var(--red)}

</style>
</head>
<body>

<div class="container">

<div class="header">
  <div class="title">Risk Gift</div>
</div>

<div class="balance">
  <div>Баланс: <b id="balance">1000</b> ₽</div>
  <button class="btn" onclick="deposit()">Пополнить</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('cases')">Кейсы (скоро)</div>
  <div class="tab" onclick="showTab('game')">🚀 Ракетка</div>
</div>

<!-- CASE -->
<div id="cases">
  <div class="case-box">
    <div class="case"></div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="game">

  <div class="multiplier" id="multiplier">1.00x</div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <input type="number" id="bet" value="100">
    <button class="btn" onclick="startGame()">Ставка</button>
    <button class="btn" onclick="cashOut()">Забрать</button>
  </div>

  <div class="players" id="players"></div>

  <div class="history" id="history"></div>

</div>

</div>

<script>
let balance = 1000;
let multiplier = 1;
let running = false;
let ctx = document.getElementById("canvas").getContext("2d");

let rocket = {x:50,y:250};
let particles = [];
let players = [];
let history = [];

function deposit(){
  balance += 1000;
  updateBalance();
}

function updateBalance(){
  document.getElementById("balance").innerText = balance;
}

function showTab(tab){
  document.getElementById("cases").style.display = tab==="cases"?"block":"none";
  document.getElementById("game").style.display = tab==="game"?"block":"none";
}

/* ROCKET DRAW */
function draw(){
  ctx.clearRect(0,0,800,300);

  // particles
  particles.forEach(p=>{
    ctx.fillStyle="orange";
    ctx.fillRect(p.x,p.y,3,3);
    p.y+=2;
  });

  // rocket (telegram-like simple)
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.moveTo(rocket.x,rocket.y);
  ctx.lineTo(rocket.x+10,rocket.y+20);
  ctx.lineTo(rocket.x-10,rocket.y+20);
  ctx.fill();
}

/* PLAYERS */
function genPlayers(){
  let names=["Alex","Ivan","Misha","Vlad","Nikita","Sasha"];
  players=[];
  for(let i=0;i<8;i++){
    players.push({
      name:names[Math.random()*names.length|0],
      bet:Math.floor(Math.random()*500)+50,
      exit:(Math.random()*2+1).toFixed(2),
      status:"play"
    });
  }
}

function renderPlayers(){
  let el=document.getElementById("players");
  el.innerHTML="";
  players.forEach(p=>{
    let text=p.name+" "+p.bet+"₽ ";
    if(p.status==="win") text+="✅ "+p.exit+"x";
    if(p.status==="lose") text+="❌";
    el.innerHTML+=text+"<br>";
  });
}

/* GAME */
function startGame(){
  if(running) return;

  let bet=+betInput.value;
  if(bet>balance) return alert("Нет денег");

  balance-=bet;
  updateBalance();

  multiplier=1;
  rocket={x:50,y:250};
  particles=[];
  running=true;

  genPlayers();
  renderPlayers();

  loop();
}

function loop(){
  if(!running) return;

  multiplier += 0.03 + Math.random()*0.05;

  // меньше шанс (раньше краш)
  let crashChance = 0.03 + multiplier*0.01;

  if(Math.random() < crashChance){
    crash();
    return;
  }

  document.getElementById("multiplier").innerText = multiplier.toFixed(2)+"x";

  rocket.x+=2;
  rocket.y-=1.2;

  particles.push({x:rocket.x,y:rocket.y+20});

  players.forEach(p=>{
    if(p.status==="play" && multiplier>=p.exit){
      p.status="win";
    }
  });

  draw();
  renderPlayers();

  requestAnimationFrame(loop);
}

function crash(){
  running=false;

  players.forEach(p=>{
    if(p.status==="play") p.status="lose";
  });

  history.unshift(multiplier.toFixed(2));
  if(history.length>15) history.pop();

  renderHistory();
  renderPlayers();

  alert("Краш на "+multiplier.toFixed(2)+"x");
}

function cashOut(){
  if(!running) return;

  let bet=+betInput.value;
  let win = bet*multiplier;

  balance += Math.floor(win);
  updateBalance();

  running=false;

  history.unshift(multiplier.toFixed(2));
  renderHistory();

  alert("Забрал "+Math.floor(win));
}

/* HISTORY */
function renderHistory(){
  let el=document.getElementById("history");
  el.innerHTML="";
  history.forEach(h=>{
    let span=document.createElement("span");
    span.innerText=h+"x";
    span.className = h>2 ? "green":"red";
    el.appendChild(span);
  });
}

/* INIT */
let betInput=document.getElementById("bet");
updateBalance();
draw();

</script>

</body>
</html>
