<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftBattle Style</title>

<style>
body{
  margin:0;
  background:#0e0e0e;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{margin-top:15px;}

.panel{
  background:#1c1c1c;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

button{
  padding:12px 18px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#4c6fff;
  color:white;
  cursor:pointer;
}

button:hover{background:#3b57d1;}

.case-box{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.case{
  padding:10px;
  background:#222;
  border-radius:10px;
  cursor:pointer;
}
.case:hover{background:#333;}

.reel{
  width:95%;
  margin:20px auto;
  overflow:hidden;
  border:2px solid #333;
  border-radius:12px;
  height:140px;
  position:relative;
}

.line{
  display:flex;
  transition: transform 4s cubic-bezier(.12,.85,.25,1);
}

.item{
  min-width:140px;
  height:120px;
  margin:10px;
  background:#2a2a2a;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.center{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:2px;
  background:red;
  transform:translateX(-50%);
}

.inv{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.box{
  background:#2a2a2a;
  padding:8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<h1>🎁 GiftBattle System</h1>

<div class="panel">
💰 Баланс: <span id="bal">10</span>
</div>

<div class="panel case-box">
<div class="case" onclick="setCase('basic')">Basic (5)</div>
<div class="case" onclick="setCase('epic')">Epic (15)</div>
<div class="case" onclick="setCase('legend')">Legend (30)</div>
</div>

<div class="panel">
<button onclick="spin()">🎰 OPEN CASE</button>
<button onclick="withdraw()">📤 WITHDRAW</button>
</div>

<div class="reel">
<div class="center"></div>
<div class="line" id="line"></div>
</div>

<h3 id="result"></h3>

<div class="panel">
<h3>📦 Inventory</h3>
<div class="inv" id="inv"></div>
</div>

<script>

let balance = 10;
let inventory = [];
let currentCase = "basic";

const cases = {
  basic: [
    {name:"🎁 Gift", value:1},
    {name:"💎 NFT", value:2},
    {name:"⭐ Rare", value:3}
  ],
  epic: [
    {name:"💎 Epic NFT", value:5},
    {name:"🔥 Rare Gift", value:8},
    {name:"⭐ Premium", value:10}
  ],
  legend: [
    {name:"👑 Legendary Gift", value:15},
    {name:"💠 TON NFT (mock)", value:25},
    {name:"🔥 Ultra Rare", value:30}
  ]
};

function setCase(c){
  currentCase = c;
}

function render(){
  document.getElementById("bal").innerText = balance;

  const inv = document.getElementById("inv");
  inv.innerHTML = "";

  inventory.forEach(i=>{
    const d = document.createElement("div");
    d.className="box";
    d.innerText = i.name + " +" + i.value;
    inv.appendChild(d);
  });
}

function buildLine(){
  const line = document.getElementById("line");
  line.innerHTML = "";

  const pool = cases[currentCase];

  for(let i=0;i<35;i++){
    const el = document.createElement("div");
    el.className="item";
    el.innerText = pool[Math.floor(Math.random()*pool.length)].name;
    line.appendChild(el);
  }
}

/* ================= SPIN ================= */
function spin(){

  if(balance <= 0){
    alert("Нет баланса");
    return;
  }

  balance -= 5;

  buildLine();

  const line = document.getElementById("line");
  const pool = cases[currentCase];

  const winItem = pool[Math.floor(Math.random()*pool.length)];

  const winIndex = Math.floor(Math.random()*20 + 8);

  const items = document.querySelectorAll(".item");
  items[winIndex].innerText = "🎁 WIN";

  const offset = -(winIndex*150 - 120);

  line.style.transform = `translateX(${offset}px)`;

  setTimeout(()=>{

    inventory.push(winItem);
    balance += winItem.value;

    document.getElementById("result").innerText =
      "🎉 Выпало: " + winItem.name;

    render();

  },4000);
}

/* ================= WITHDRAW ================= */
function withdraw(){

  if(inventory.length === 0){
    alert("Нет предметов");
    return;
  }

  const item = inventory[0];
  inventory.shift();

  alert("Заявка на вывод: " + item.name + " отправлена (mock)");
}

render();

</script>

</body>
</html>
