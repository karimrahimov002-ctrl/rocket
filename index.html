<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift 3D</title>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background: radial-gradient(circle,#2e1065,#020617);
  overflow:hidden;
}

/* HEADER */
.header{
  position:absolute;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:rgba(15,23,42,0.8);
  backdrop-filter:blur(10px);
  z-index:10;
}

.btn{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(145deg,#7c3aed,#5b21b6);
  color:white;
  cursor:pointer;
  box-shadow:
    0 6px 0 #3b0764,
    0 12px 25px rgba(0,0,0,0.6);
  transition:0.1s;
}
.btn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #3b0764;
}

#ui{
  position:absolute;
  bottom:0;
  width:100%;
  padding:10px;
  z-index:10;
}

#mult{
  text-align:center;
  font-size:50px;
}

.panel{
  display:flex;
  gap:10px;
  margin-top:10px;
}

input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
}

.depositBox{
  margin-top:10px;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="header">
  <div>Баланс: <span id="balance">1000</span> TON</div>
  <div id="wallet">Кошелек не подключен</div>
</div>

<div id="ton-connect" style="position:absolute;top:60px;left:10px;z-index:10;"></div>

<div id="mult">1.00x</div>

<div id="ui">
  <div class="panel">
    <input id="bet" type="number" value="100">
    <button class="btn" onclick="bet()">Ставка</button>
    <button class="btn" onclick="cash()">Забрать</button>
    <button class="btn" onclick="deposit()">TON</button>
  </div>

  <div class="depositBox">
    🎁 Подарки: отправьте подарок в Telegram на <b>@riskgift_bot</b><br>
    после этого вам начислят TON вручную
  </div>
</div>

<script>

/* ===== TON CONNECT ===== */
const ton = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl:'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json',
  buttonRootId:'ton-connect'
});

ton.onStatusChange(w=>{
  if(w){
    wallet.innerText = "Кошелек: "+w.account.address.slice(0,6)+"...";
  }
});

/* ===== DEPOSIT ===== */
async function deposit(){
  if(!ton.connected){
    alert("Подключи кошелек");
    return;
  }

  await ton.sendTransaction({
    validUntil: Math.floor(Date.now()/1000)+600,
    messages:[{
      address:"UQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", // замени
      amount:"100000000"
    }]
  });
}

/* ===== GAME ===== */
let mult=1;
let running=true;

function gameLoop(){
  requestAnimationFrame(gameLoop);

  if(!running) return;

  mult *= 1.005; // медленно

  let crashChance = 0.008 + mult*0.006;

  if(Math.random()<crashChance){
    running=false;
    document.getElementById("mult").innerText="💥 "+mult.toFixed(2);

    setTimeout(()=>{
      mult=1;
      running=true;
    },2000);

    return;
  }

  document.getElementById("mult").innerText = mult.toFixed(2)+"x";

  updateRocket();
}

/* ===== BET ===== */
function bet(){
  let b=+betInput.value;
  balance.innerText -= b;
}

function cash(){
  balance.innerText = +balance.innerText + Math.floor(+betInput.value * mult);
}

/* ===== THREE.JS ROCKET ===== */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
const light = new THREE.PointLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

/* ROCKET (простая 3D модель) */
const geometry = new THREE.ConeGeometry(0.5,2,32);
const material = new THREE.MeshStandardMaterial({color:0xff0000});
const rocket = new THREE.Mesh(geometry,material);
scene.add(rocket);

camera.position.z = 5;

/* ANIMATION */
function updateRocket(){
  rocket.position.x += 0.01;
  rocket.position.y = Math.sin(mult/2);
  rocket.rotation.z += 0.05;
}

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

/* INIT */
const betInput=document.getElementById("bet");

gameLoop();

</script>

</body>
</html>
