<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background: radial-gradient(circle at top,#2e1065,#020617);
  overflow:hidden;
}

/* STAR BG */
#stars{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* HEADER */
.balance{
  display:flex;
  justify-content:space-between;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* TABS */
.tabs{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.tab{
  flex:1;
  padding:10px;
  background:#1e293b;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}
.active{
  background:#7c3aed;
}

/* SCREENS */
.screen{display:none;}
.activeScreen{display:block;}

/* GAME */
.mult{
  font-size:50px;
  text-align:center;
  margin:10px 0;
}

#graph{
  width:100%;
  height:250px;
  background:black;
  border-radius:10px;
  position:relative;
}

.tgRocket{
  position:absolute;
  font-size:24px;
}

/* PLAYERS */
.players{
  display:flex;
  gap:10px;
  margin-top:10px;
  overflow-x:auto;
}
.player{
  text-align:center;
}
.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* HISTORY */
.history{
  display:flex;
  gap:5px;
  margin-top:10px;
  flex-wrap:wrap;
}
.history span{
  background:#1e293b;
  padding:5px;
  border-radius:6px;
}

/* CASE */
.case{
  margin-top:30px;
  text-align:center;
  font-size:22px;
}

/* DEPOSIT */
.deposit{
  margin-top:20px;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">

<div class="balance">
  <div>Баланс: <b id="balance">1000</b> TON</div>
  <button onclick="openDeposit()">Пополнить</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="openTab('rocket')">🚀 Ракетка</div>
  <div class="tab" onclick="openTab('cases')">📦 Кейсы</div>
  <div class="tab" onclick="openTab('gift')">🎁 Подарок</div>
</div>

<!-- ROCKET -->
<div id="rocket" class="screen activeScreen">
  <div class="mult" id="mult">1.00x</div>

  <div id="graph">
    <canvas id="graphCanvas"></canvas>
    <div id="rocketIcon" class="tgRocket">🚀</div>
  </div>

  <div class="players" id="players"></div>
  <div class="history" id="history"></div>
</div>

<!-- CASES -->
<div id="cases" class="screen">
  <div class="case">📦 Скоро</div>
</div>

<!-- GIFT -->
<div id="gift" class="screen">
  <div class="deposit">
    📩 Отправьте подарок в Telegram: <b>@riskgift_bot</b><br>
    После этого вам придут TON на баланс автоматически
  </div>
</div>

</div>

<script>

/* ===== STARS ===== */
let sctx=stars.getContext("2d");
let starsArr=[];
for(let i=0;i<200;i++){
  starsArr.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight});
}
function drawStars(){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  sctx.fillStyle="white";
  starsArr.forEach(s=>{
    sctx.fillRect(s.x,s.y,2,2);
    s.y+=0.2;
    if(s.y>innerHeight) s.y=0;
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ===== TABS ===== */
function openTab(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("activeScreen"));
  document.getElementById(id).classList.add("activeScreen");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");
}

/* ===== GRAPH ===== */
let ctx=graphCanvas.getContext("2d");
let points=[];
let x=0;

/* ===== PLAYERS ===== */
let names=["Alex","Ivan","Misha","Vlad","Nikita","Sasha"];
let avatars=["🐶","🐱","🐸","🤖","👽","🐵"];

function genPlayers(){
  let el=document.getElementById("players");
  el.innerHTML="";
  for(let i=0;i<8;i++){
    let div=document.createElement("div");
    div.className="player";
    div.innerHTML=`
      <div class="avatar">${avatars[Math.random()*avatars.length|0]}</div>
      <div>${names[Math.random()*names.length|0]}</div>
    `;
    el.appendChild(div);
  }
}

/* ===== HISTORY ===== */
let history=[];
function renderHistory(){
  let el=document.getElementById("history");
  el.innerHTML="";
  history.forEach(h=>{
    let s=document.createElement("span");
    s.innerText=h+"x";
    el.appendChild(s);
  });
}

/* ===== GAME LOOP ===== */
let mult=1;

function loop(){
  requestAnimationFrame(loop);

  mult += 0.01 + Math.random()*0.02;

  let crashChance = 0.03 + mult*0.015;

  if(Math.random()<crashChance){
    history.unshift(mult.toFixed(2));
    if(history.length>12) history.pop();
    renderHistory();

    mult=1;
    x=0;
    points=[];
    genPlayers();
    return;
  }

  document.getElementById("mult").innerText = mult.toFixed(2)+"x";

  x+=2;
  points.push({x:x,y:250 - mult*20});

  ctx.clearRect(0,0,1000,250);
  ctx.beginPath();
  ctx.strokeStyle="lime";

  points.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });

  ctx.stroke();

  let last=points[points.length-1];
  if(last){
    rocketIcon.style.left=last.x+"px";
    rocketIcon.style.top=last.y+"px";
  }
}

/* INIT */
genPlayers();
renderHistory();
loop();

</script>

</body>
</html>
