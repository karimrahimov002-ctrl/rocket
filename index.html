<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

/* HEADER */
.balance{
  display:flex;
  justify-content:space-between;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.tab{
  flex:1;
  padding:10px;
  background:#1e293b;
  border-radius:10px;
  cursor:pointer;
}
.active{
  background:#7c3aed;
}

/* CASE */
.case-box{
  width:220px;
  height:220px;
  margin:40px auto;
  border-radius:20px;
  background:linear-gradient(145deg,#6d28d9,#9333ea);
  transform:rotateX(20deg) rotateY(-20deg);
  box-shadow:0 20px 40px rgba(124,58,237,0.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.case-box img{
  width:80px;
}

/* GAME */
.game{display:none;}

.mult{
  font-size:60px;
  text-align:center;
}

canvas{
  width:100%;
  height:300px;
  border-radius:10px;
  background:black;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.controls input{
  flex:1;
  padding:10px;
}

/* PLAYERS */
.players{
  display:flex;
  gap:10px;
  margin-top:10px;
  overflow-x:auto;
}
.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* HISTORY */
.history{
  display:flex;
  gap:5px;
  margin-top:10px;
  flex-wrap:wrap;
}
.history span{
  background:#1e293b;
  padding:5px;
  border-radius:6px;
}

/* DEPOSIT */
.deposit{
  display:none;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="balance">
  <div>Баланс: <b id="balance">1000</b> TON</div>
  <button onclick="openDeposit()">Пополнить</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('cases')">Кейсы</div>
  <div class="tab" onclick="showTab('game')">🚀 Ракетка</div>
</div>

<!-- CASE -->
<div id="cases">
  <div class="case-box">
    <img src="https://cdn-icons-png.flaticon.com/512/3523/3523887.png">
    <b>Скоро</b>
  </div>
</div>

<!-- GAME -->
<div id="game" class="game">

<div class="mult" id="mult">1.00x</div>

<canvas id="graph"></canvas>
<canvas id="three"></canvas>

<div class="controls">
  <input type="number" id="bet" value="100">
  <button onclick="startGame()">Ставка</button>
  <button onclick="cashOut()">Забрать</button>
</div>

<div class="players" id="players"></div>
<div class="history" id="history"></div>

</div>

<!-- DEPOSIT -->
<div id="deposit" class="deposit">
  <h2>Пополнение</h2>
  <p>Отправь подарок TON на адрес:</p>
  <b>UQ123...TON</b><br><br>
  <button onclick="showTab('cases')">Назад</button>
</div>

</div>

<!-- THREE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
let balance=1000;
let running=false;
let mult=1;

/* UI */
function updateBalance(){
  document.getElementById("balance").innerText=balance;
}
function showTab(tab){
  document.getElementById("cases").style.display = tab==="cases"?"block":"none";
  document.getElementById("game").style.display = tab==="game"?"block":"none";
  document.getElementById("deposit").style.display="none";
}
function openDeposit(){
  document.getElementById("cases").style.display="none";
  document.getElementById("game").style.display="none";
  document.getElementById("deposit").style.display="block";
}

/* GRAPH */
let gctx=document.getElementById("graph").getContext("2d");
let points=[];
let gx=0;

function drawGraph(){
  gctx.clearRect(0,0,1000,300);
  gctx.beginPath();
  gctx.strokeStyle="lime";
  points.forEach((p,i)=>{
    if(i===0) gctx.moveTo(p.x,p.y);
    else gctx.lineTo(p.x,p.y);
  });
  gctx.stroke();
}

/* THREE */
let scene,camera,renderer,rocket,flame;

function init3D(){
  const canvas=document.getElementById("three");

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,canvas.clientWidth/300,0.1,1000);
  renderer=new THREE.WebGLRenderer({canvas,alpha:true});
  renderer.setSize(canvas.clientWidth,300);

  let light=new THREE.PointLight(0xffffff,1);
  light.position.set(5,5,5);
  scene.add(light);

  let body=new THREE.CylinderGeometry(0.2,0.2,1.5,32);
  let mat=new THREE.MeshStandardMaterial({color:0xffffff});
  rocket=new THREE.Mesh(body,mat);

  let nose=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.5,32),mat);
  nose.position.y=1;
  rocket.add(nose);

  flame=new THREE.Mesh(
    new THREE.ConeGeometry(0.2,0.5,32),
    new THREE.MeshBasicMaterial({color:0xff6600})
  );
  flame.position.y=-1;
  flame.rotation.x=Math.PI;
  rocket.add(flame);

  scene.add(rocket);
  camera.position.z=5;
}
init3D();

/* PLAYERS */
let avatars=["🐶","🐱","🐸","🤖","👽","🐵"];
function genPlayers(){
  let el=document.getElementById("players");
  el.innerHTML="";
  for(let i=0;i<10;i++){
    let d=document.createElement("div");
    d.className="avatar";
    d.innerText=avatars[Math.random()*avatars.length|0];
    el.appendChild(d);
  }
}

/* GAME LOOP */
function loop(){
  if(!running) return;

  requestAnimationFrame(loop);

  mult += 0.05 + Math.random()*0.07;

  let crashChance = 0.04 + mult*0.02;
  if(Math.random()<crashChance){
    crash();
    return;
  }

  document.getElementById("mult").innerText = mult.toFixed(2)+"x";

  /* GRAPH */
  gx+=4;
  points.push({x:gx,y:300 - mult*30});
  drawGraph();

  /* 3D */
  rocket.position.x += 0.02;
  rocket.position.y += 0.01;
  rocket.rotation.z = -0.3;
  flame.scale.y = 1 + Math.random();

  renderer.render(scene,camera);
}

/* START */
function startGame(){
  if(running) return;

  let bet=+betInput.value;
  if(bet>balance) return alert("Нет TON");

  balance-=bet;
  updateBalance();

  mult=1;
  running=true;
  gx=0;
  points=[];

  rocket.position.set(0,0,0);

  genPlayers();
  loop();
}

/* CRASH */
function crash(){
  running=false;

  history.unshift(mult.toFixed(2));
  renderHistory();

  alert("💥 Краш "+mult.toFixed(2)+"x");
}

/* CASHOUT */
function cashOut(){
  if(!running) return;

  let bet=+betInput.value;
  let win=bet*mult;

  balance+=Math.floor(win);
  updateBalance();

  running=false;

  history.unshift(mult.toFixed(2));
  renderHistory();

  alert("💰 "+Math.floor(win)+" TON");
}

/* HISTORY */
let history=[];
function renderHistory(){
  let el=document.getElementById("history");
  el.innerHTML="";
  history.forEach(h=>{
    let s=document.createElement("span");
    s.innerText=h+"x";
    el.appendChild(s);
  });
}

let betInput=document.getElementById("bet");
updateBalance();
</script>

</body>
</html>
