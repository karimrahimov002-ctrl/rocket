<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift ULTRA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===================== GLOBAL ===================== */
body{
    margin:0;
    font-family:Arial;
    color:white;
    background: radial-gradient(circle at top,#2e1065,#020617);
    overflow:hidden;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* ===================== BACKGROUND ===================== */
#starsCanvas, #giftsCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
}

/* ===================== HEADER ===================== */
.balance{
    display:flex;
    justify-content:space-between;
    background:#0f172a;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

/* ===================== DEPOSIT ===================== */
.deposit{
    background:#0f172a;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    font-size:14px;
}

/* ===================== MULT ===================== */
.multiplier{
    font-size:58px;
    text-align:center;
    margin:10px 0;
    text-shadow:0 0 20px rgba(167,139,250,0.8);
}

/* ===================== GRAPH ===================== */
#graphContainer{
    position:relative;
    width:100%;
    height:260px;
    border-radius:12px;
    overflow:hidden;
    background:black;
}

#graphCanvas{
    width:100%;
    height:100%;
}

.tgRocket{
    position:absolute;
    font-size:26px;
    pointer-events:none;
}

/* ===================== THREE ===================== */
#threeCanvas{
    width:100%;
    height:300px;
    margin-top:10px;
}

/* ===================== PLAYERS ===================== */
.players{
    display:flex;
    gap:12px;
    margin-top:12px;
    overflow-x:auto;
}

.player{
    text-align:center;
    min-width:70px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.status{
    font-size:11px;
}

/* ===================== HISTORY ===================== */
.history{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
}

.history span{
    background:#1e293b;
    padding:5px 7px;
    border-radius:6px;
    font-size:12px;
}

</style>
</head>

<body>

<canvas id="starsCanvas"></canvas>
<canvas id="giftsCanvas"></canvas>

<div class="container">

<div class="balance">
    <div>Баланс: <b id="balance">1000</b> TON</div>
</div>

<div class="deposit">
📩 Отправьте подарок на Telegram: <b>@riskgift_bot</b><br>
После этого вам придут TON на баланс автоматически
</div>

<div class="multiplier" id="mult">1.00x</div>

<div id="graphContainer">
    <canvas id="graphCanvas"></canvas>
    <div class="tgRocket" id="tgRocket">🚀</div>
</div>

<canvas id="threeCanvas"></canvas>

<div class="players" id="players"></div>
<div class="history" id="history"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>

/* ===================== DATA ===================== */
let balance = 1000;
let multiplier = 1;
let running = true;

let graphPoints = [];
let graphX = 0;

/* ===================== STARS ===================== */
const starsCtx = starsCanvas.getContext("2d");
let stars = [];

for(let i=0;i<300;i++){
    stars.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        speed:Math.random()*0.5
    });
}

function drawStars(){
    starsCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
    starsCtx.fillStyle="white";

    stars.forEach(s=>{
        starsCtx.fillRect(s.x,s.y,2,2);
        s.y += s.speed;
        if(s.y > window.innerHeight) s.y = 0;
    });

    requestAnimationFrame(drawStars);
}
drawStars();

/* ===================== GIFTS BACKGROUND ===================== */
const giftsCtx = giftsCanvas.getContext("2d");
let gifts = [];

for(let i=0;i<40;i++){
    gifts.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        size:10 + Math.random()*10
    });
}

function drawGifts(){
    giftsCtx.clearRect(0,0,window.innerWidth,window.innerHeight);

    gifts.forEach(g=>{
        giftsCtx.fillStyle="rgba(168,85,247,0.2)";
        giftsCtx.fillRect(g.x,g.y,g.size,g.size);
        g.y += 0.2;
        if(g.y>window.innerHeight) g.y=0;
    });

    requestAnimationFrame(drawGifts);
}
drawGifts();

/* ===================== GRAPH ===================== */
const graphCtx = graphCanvas.getContext("2d");

function drawGraph(){
    graphCtx.clearRect(0,0,1000,260);

    // grid
    graphCtx.strokeStyle="#1e293b";
    for(let i=0;i<10;i++){
        graphCtx.beginPath();
        graphCtx.moveTo(0,i*25);
        graphCtx.lineTo(1000,i*25);
        graphCtx.stroke();
    }

    // line
    graphCtx.beginPath();
    graphCtx.strokeStyle="lime";
    graphCtx.shadowColor="lime";
    graphCtx.shadowBlur=10;

    graphPoints.forEach((p,i)=>{
        if(i===0) graphCtx.moveTo(p.x,p.y);
        else graphCtx.lineTo(p.x,p.y);
    });

    graphCtx.stroke();
    graphCtx.shadowBlur=0;

    let last = graphPoints[graphPoints.length-1];
    if(last){
        tgRocket.style.left = last.x + "px";
        tgRocket.style.top = last.y + "px";
    }
}

/* ===================== THREE ===================== */
let scene,camera,renderer,rocket,flame;

function init3D(){
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(75,2,0.1,1000);

    renderer=new THREE.WebGLRenderer({
        canvas:threeCanvas,
        alpha:true
    });

    renderer.setSize(800,300);

    let light=new THREE.PointLight(0xffffff,1);
    light.position.set(5,5,5);
    scene.add(light);

    rocket = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2,0.2,1.5,32),
        new THREE.MeshStandardMaterial({color:0xffffff})
    );

    let nose = new THREE.Mesh(
        new THREE.ConeGeometry(0.2,0.5,32),
        new THREE.MeshStandardMaterial({color:0xff0000})
    );

    nose.position.y=1;
    rocket.add(nose);

    flame = new THREE.Mesh(
        new THREE.ConeGeometry(0.2,0.5,32),
        new THREE.MeshBasicMaterial({color:0xff6600})
    );

    flame.position.y=-1;
    flame.rotation.x=Math.PI;
    rocket.add(flame);

    scene.add(rocket);
    camera.position.z=5;
}
init3D();

/* ===================== PLAYERS ===================== */
let names=["Alex","Ivan","Misha","Vlad","Nikita","Sasha","Oleg","Max"];
let avatars=["🐶","🐱","🐸","🤖","👽","🐵","🐼"];

let players=[];

function generatePlayers(){
    players=[];
    for(let i=0;i<10;i++){
        players.push({
            name:names[Math.random()*names.length|0],
            avatar:avatars[Math.random()*avatars.length|0],
            exit:(Math.random()*3+1).toFixed(2),
            status:"playing"
        });
    }
    renderPlayers();
}

function renderPlayers(){
    let el=document.getElementById("players");
    el.innerHTML="";

    players.forEach(p=>{
        let div=document.createElement("div");
        div.className="player";

        div.innerHTML = `
            <div class="avatar">${p.avatar}</div>
            <div>${p.name}</div>
            <div class="status">${p.status}</div>
        `;

        el.appendChild(div);
    });
}

/* ===================== HISTORY ===================== */
let history=[];

function renderHistory(){
    let el=document.getElementById("history");
    el.innerHTML="";
    history.forEach(h=>{
        let s=document.createElement("span");
        s.innerText=h+"x";
        el.appendChild(s);
    });
}

/* ===================== MAIN LOOP ===================== */
function loop(){
    requestAnimationFrame(loop);

    multiplier += 0.01 + Math.random()*0.02;

    let crashChance = 0.02 + multiplier*0.012;

    if(Math.random()<crashChance){
        history.unshift(multiplier.toFixed(2));
        if(history.length>15) history.pop();
        renderHistory();

        multiplier=1;
        graphX=0;
        graphPoints=[];

        generatePlayers();
        return;
    }

    document.getElementById("mult").innerText = multiplier.toFixed(2)+"x";

    graphX += 2;
    graphPoints.push({
        x:graphX,
        y:260 - multiplier*20
    });

    players.forEach(p=>{
        if(p.status==="playing" && multiplier>=p.exit){
            p.status="cashout";
        }
    });

    drawGraph();
    renderPlayers();

    rocket.position.x += 0.01;
    rocket.position.y += 0.005;
    rocket.rotation.z = -0.3;

    flame.scale.y = 1 + Math.random();

    renderer.render(scene,camera);
}

/* ===================== INIT ===================== */
generatePlayers();
renderHistory();
loop();

</script>

</body>
</html>
