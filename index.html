<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Riskgift — пополнение через TON Connect</title>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0b0e1a, #03050b);
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            color: #f0f3ff;
            padding: 16px 12px 32px;
        }
        .glow { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff8; }
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(0, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0); }
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid rgba(0,255,255,0.2);
        }
        .balance-box {
            background: #00000055;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plus-btn {
            background: cyan;
            color: black;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
            transition: 0.2s;
            box-shadow: 0 0 8px cyan;
        }
        .plus-btn:hover { transform: scale(1.05); }
        .ton-connect-btn {
            background: #0088cc;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }
        .inventory-btn {
            background: linear-gradient(90deg, #7a5ac5, #4a2a8a);
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            width: 100%;
            margin: 12px 0;
            cursor: pointer;
            text-align: center;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 8px 4px;
        }
        .case-item {
            background: linear-gradient(145deg, #11161f, #080c14);
            border-radius: 28px;
            padding: 14px 10px;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .case-item:hover {
            transform: translateY(-3px);
            border-color: cyan;
            box-shadow: 0 8px 20px -6px #0ff3;
        }
        .case-3d-icon { font-size: 2.5rem; filter: drop-shadow(0 0 4px cyan); margin: 6px 0; }
        .case-title { font-weight: 700; font-size: 0.9rem; }
        .case-price { color: #ffd966; font-weight: bold; margin: 4px 0; font-size: 0.85rem; }
        .case-drops {
            font-size: 0.6rem;
            background: #00000066;
            border-radius: 16px;
            padding: 4px;
            margin: 6px 0;
            cursor: pointer;
            color: #aaffdd;
        }
        .btn-open {
            background: linear-gradient(90deg, #0ff, #0a7eff);
            border: none;
            padding: 6px 10px;
            border-radius: 40px;
            font-weight: bold;
            color: #000;
            width: 100%;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: #0a0f1ae0;
            backdrop-filter: blur(20px);
            border-radius: 40px;
            width: 90%;
            max-width: 500px;
            padding: 20px 16px;
            border: 1px solid cyan;
            text-align: center;
        }
        .slot-machine {
            margin: 20px 0;
            overflow-x: hidden;
            background: #00000099;
            border-radius: 60px;
            padding: 8px 0;
            position: relative;
        }
        .slot-track {
            display: flex;
            gap: 16px;
            will-change: transform;
            transition: transform cubic-bezier(0.1, 0.9, 0.2, 1.05) 2.8s;
        }
        .slot-item {
            background: linear-gradient(145deg, #1a1f2e, #0f1422);
            border-radius: 32px;
            min-width: 100px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .slot-icon { font-size: 2.5rem; margin-bottom: 8px; display: flex; justify-content: center; }
        .slot-icon img { width: 48px; height: 48px; object-fit: contain; }
        .slot-label { font-size: 0.75rem; font-weight: bold; color: cyan; }
        .inventory-list, .history-list {
            max-height: 400px;
            overflow-y: auto;
            margin: 12px 0;
            padding-right: 4px;
        }
        .gift-card {
            background: linear-gradient(135deg, #0f1422, #0a0e1a);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 3px solid cyan;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .gift-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .gift-icon { font-size: 2rem; display: flex; align-items: center; justify-content: center; }
        .gift-icon img { width: 48px; height: 48px; object-fit: contain; }
        .gift-details { text-align: left; }
        .gift-name { font-weight: bold; font-size: 1rem; }
        .gift-rarity { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; display: inline-block; }
        .rarity-common { background: #3a6ea5; }
        .rarity-rare { background: #7a5ac5; }
        .rarity-epic { background: #c97e00; }
        .rarity-legendary { background: #c41e3a; }
        .gift-value { color: #ffd966; font-size: 0.8rem; }
        button {
            background: linear-gradient(90deg, #0ff, #0a6cff);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .sell-btn { background: linear-gradient(90deg, #ffaa00, #ff6600); color: black; margin-left: 4px; }
        .close-btn, .secondary-btn { background: #222; color: white; }
        .flex-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        .bank-link {
            display: inline-block;
            margin: 8px 0;
            background: #2a2e4a;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 60px;
        }
        .history-item {
            background: linear-gradient(135deg, #0f1422, #0a0e1a);
            border-radius: 24px;
            padding: 10px 16px;
            margin-bottom: 8px;
            border-left: 3px solid cyan;
        }
        .amount-select {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .amount-btn {
            background: #1f2a3a;
            padding: 10px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .amount-btn.active { background: cyan; color: black; }
        .custom-amount {
            background: #1a1f2e;
            border: 1px solid cyan;
            border-radius: 40px;
            padding: 10px;
            width: 100px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

<div id="mainScreen">
    <div class="top-bar">
        <div class="balance-box">
            💰 <span id="userBalance">0.00</span> TON
            <div class="plus-btn" id="plusBalanceBtn">+</div>
        </div>
        <div id="tonConnectButton"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
        <h2>⚡ КЕЙСЫ </h2>
        <button id="goToBankBtn" style="background: #2a2e4a; font-size: 0.7rem;">🏦 Банк подарков</button>
    </div>
    
    <button id="inventoryMainBtn" class="inventory-btn">📦 МОЙ ИНВЕНТАРЬ (подарки и NFT)</button>
    
    <div class="cases-grid" id="casesContainer"></div>
</div>

<!-- МОДАЛКА БАРАБАНА -->
<div id="slotModal" class="modal">
    <div class="modal-content">
        <h3>🎰 ВРАЩЕНИЕ БАРАБАНА</h3>
        <div class="slot-machine"><div id="slotTrack" class="slot-track"></div></div>
        <p id="slotResultMsg" style="margin-top: 10px;"></p>
        <button id="closeSlotBtn" class="close-btn">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА ПОПОЛНЕНИЯ ЧЕРЕЗ TON CONNECT -->
<div id="depositModal" class="modal">
    <div class="modal-content">
        <h3>💰 ПОПОЛНЕНИЕ БАЛАНСА</h3>
       <p style="margin: 16px 0;">Отправьте любой ваш подарок в банк подарков <strong>@riskgift_bank</strong><br>После отправки вам начислят баланс, а подарок появится в инвентаре.</p> 
        <p>Выберите сумму (TON):</p>
        <div class="amount-select" id="amountSelect">
            <div class="amount-btn" data-amount="1">1 TON</div>
            <div class="amount-btn" data-amount="5">5 TON</div>
            <div class="amount-btn" data-amount="10">10 TON</div>
            <div class="amount-btn" data-amount="25">25 TON</div>
            <div class="amount-btn" data-amount="50">50 TON</div>
            <div class="amount-btn" data-amount="100">100 TON</div>
        </div>
        <div style="margin: 12px 0;">
            <input type="number" id="customAmount" class="custom-amount" placeholder="Своя сумма" min="0.1" step="1">
        </div>
        <button id="confirmDepositBtn" class="ton-connect-btn" style="background: #0a6cff; margin-top: 10px;">💎 Пополнить через TON </button>
        <button id="closeDepositModalBtn" class="close-btn" style="margin-top: 16px;">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА ИНВЕНТАРЯ -->
<div id="inventoryModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <h3>📦 ВСЕ ВАШИ ПОДАРКИ И NFT</h3>
        <div id="inventoryModalList" class="inventory-list"></div>
        <button id="closeInventoryModalBtn" class="close-btn">Закрыть</button>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ TON CONNECT ==========
    // !!! ВСТАВЬТЕ ВАШ РЕАЛЬНЫЙ АДРЕС КОШЕЛЬКА ДЛЯ ПРИЁМА TON !!!
    const PROJECT_WALLET_ADDRESS = "UQAtQAePeh8BtF7blalA1z-ARWr3rH2EHNc4CKWuDlhuGuoT
"; // ЗАМЕНИТЕ НА ВАШ АДРЕС
    
    // Манифест для TON Connect (можно разместить на своём сайте, но для демо используем публичный)
    const MANIFEST_URL = "https://raw.githubusercontent.com/ton-connect/demo-dapp/main/manifest.json";
    
    let tonConnectUI = null;
    
    // Инициализация TON Connect
    function initTonConnect() {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: MANIFEST_URL,
            buttonRootId: "tonConnectButton"
        });
        // При изменении кошелька обновляем интерфейс
        tonConnectUI.onStatusChange((wallet) => {
            if (wallet) {
                console.log("Кошелёк подключён:", wallet.account.address);
            } else {
                console.log("Кошелёк отключён");
            }
        });
    }
    
    // ========== ОСТАЛЬНАЯ ЛОГИКА ==========
    const CASES = [
        { id:0, name:"Trash Case", price:0.1, icon:"🗑️", drops:["0.01-0.05 TON"] },
        { id:1, name:"Starter Pack", price:1, icon:"📦", drops:["0.1-0.5 TON"] },
        { id:2, name:"Crypto Vortex", price:5, icon:"🌀", drops:["0.5-2.5 TON"] },
        { id:15, name:"Neon Rush", price:5, icon:"⚡", drops:["0.6-2.8 TON"] },
        { id:3, name:"Hype Blaze", price:10, icon:"🔥", drops:["1-5 TON"] },
        { id:16, name:"Phantom Core", price:10, icon:"👻", drops:["1.2-6 TON"] },
        { id:4, name:"Magnate", price:25, icon:"👑", drops:["2.5-12 TON"] },
        { id:17, name:"Golden Era", price:25, icon:"🏆", drops:["3-13 TON"] }
    ];
    
    const RARE_GIFTS_DATA = [
        { id:"xmas", name:"Xmas Stocking", icon:"🧦", rarity:"rare", valueTon:2.2, weight:40 },
        { id:"clover", name:"Clover Pin", icon:"🍀", rarity:"rare", valueTon:3.4, weight:30 },
        { id:"tama", name:"Tama Gadget", icon:"📟", rarity:"epic", valueTon:2.6, weight:35 },
        { id:"lol", name:"Lol Pop", icon:"😂", rarity:"rare", valueTon:2.4, weight:38 },
        { id:"ice", name:"Ice Cream", icon:"🍦", rarity:"common", valueTon:2.4, weight:38 },
        { id:"snoop", name:"Snoop Dogg", icon:"🐶", rarity:"legendary", valueTon:4.8, weight:12 },
        { id:"calendar", name:"Desk Calendar", icon:"📅", rarity:"common", valueTon:4.2, weight:20 }
    ];
    const NFT_GIFTS_DATA = [
        { name:"Mad Pumpkin", valueTon:9.1, icon:"🎃", weight:45 },
        { name:"Eternal Rose", valueTon:17.9, icon:"🌹", weight:25 },
        { name:"Voodoo Doll", valueTon:28.4, icon:"🪆", weight:12 },
        { name:"Kissed Frog", valueTon:36.1, icon:"🐸", weight:8 }
    ];
    
    let RARE_GIFTS = [];
    let NFT_GIFTS = [];
    
    function initGiftsArrays() {
        RARE_GIFTS = RARE_GIFTS_DATA.map(g => ({ ...g, image: null }));
        NFT_GIFTS = NFT_GIFTS_DATA.map(n => ({ ...n, image: null }));
    }
    
    function weightedRandom(items) {
        let totalWeight = items.reduce((sum, item) => sum + (item.weight || 1), 0);
        let rand = Math.random() * totalWeight;
        let accum = 0;
        for (let item of items) {
            accum += (item.weight || 1);
            if (rand < accum) return item;
        }
        return items[0];
    }
    
    // Пользовательские данные
    let allUsersData = {};
    let currentUser = null;
    let userHistory = [];
    
    function initInventoryObj() {
        let inv = {};
        RARE_GIFTS.forEach(g => inv[g.id] = 0);
        inv.nft = [];
        return inv;
    }
    
    function loadAllData() {
        const saved = localStorage.getItem('riskgift_allusers_v17');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                allUsersData = data.allUsers || {};
            } catch(e) {}
        }
        if (!allUsersData['default_user']) {
            allUsersData['default_user'] = { tonBalance: 20.0, inventory: initInventoryObj(), history: [] };
        }
    }
    function saveAllData() {
        localStorage.setItem('riskgift_allusers_v17', JSON.stringify({ allUsers: allUsersData }));
    }
    
    function initCurrentUser() {
        let tgUser = null;
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        }
        if (tgUser && tgUser.username) {
            currentUser = tgUser.username.toLowerCase();
        } else {
            let saved = localStorage.getItem('riskgift_temp_user');
            if (saved) currentUser = saved;
            else {
                currentUser = 'user_' + Math.floor(Math.random() * 100000);
                localStorage.setItem('riskgift_temp_user', currentUser);
            }
        }
        if (!allUsersData[currentUser]) {
            allUsersData[currentUser] = { tonBalance: 15.0, inventory: initInventoryObj(), history: [] };
        }
        userHistory = allUsersData[currentUser].history || [];
        saveAllData();
    }
    
    function getUserData() { return allUsersData[currentUser]; }
    function updateBalanceUI() { document.getElementById('userBalance').innerText = getUserData().tonBalance.toFixed(4); }
    function addHistoryEntry(entry) {
        userHistory.unshift(entry);
        if (userHistory.length > 20) userHistory.pop();
        allUsersData[currentUser].history = userHistory;
        saveAllData();
    }
    function addRareGiftToUser(giftId) {
        const user = getUserData();
        user.inventory[giftId] = (user.inventory[giftId] || 0) + 1;
        saveAllData();
    }
    function addNftToUser(nftObj) {
        const user = getUserData();
        user.inventory.nft.push({ ...nftObj });
        saveAllData();
    }
    function addTonToUser(amount) {
        getUserData().tonBalance += amount;
        saveAllData();
        updateBalanceUI();
    }
    function removeRareGift(giftId) {
        const user = getUserData();
        if (user.inventory[giftId] > 0) {
            user.inventory[giftId]--;
            saveAllData();
            return true;
        }
        return false;
    }
    function removeNftItem(idx) {
        const user = getUserData();
        if (user.inventory.nft[idx]) {
            user.inventory.nft.splice(idx, 1);
            saveAllData();
            return true;
        }
        return false;
    }
    
    // Генерация случайного слота
    function generateRandomSlotItem(casePrice) {
        const r = Math.random();
        if (r < 0.6) {
            const percent = 0.1 + Math.random() * 0.4;
            let winTon = casePrice * percent;
            winTon = Math.round(winTon * 1000) / 1000;
            return { type:'ton', value:winTon, icon:'💰', label:`${winTon.toFixed(3)} TON`, image:null };
        } else if (r < 0.85) {
            const selected = weightedRandom(RARE_GIFTS);
            return { type:'rare', giftId:selected.id, giftName:selected.name, icon:selected.icon, label:selected.name, image:selected.image, valueTon:selected.valueTon };
        } else {
            const selected = weightedRandom(NFT_GIFTS);
            return { type:'nft', nftData:selected, icon:selected.icon, label:selected.name, image:selected.image, valueTon:selected.valueTon };
        }
    }
    
    // Честный барабан
    function spinSlot(casePrice, onComplete) {
        const slotTrack = document.getElementById('slotTrack');
        const resultMsg = document.getElementById('slotResultMsg');
        const modal = document.getElementById('slotModal');
        let slotItems = [];
        for (let i = 0; i < 35; i++) slotItems.push(generateRandomSlotItem(casePrice));
        slotTrack.innerHTML = '';
        slotItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'slot-item';
            const imgHtml = item.image ? `<img src="${item.image}">` : `<div style="font-size:2.5rem;">${item.icon}</div>`;
            div.innerHTML = `<div class="slot-icon">${imgHtml}</div><div class="slot-label">${item.label}</div>`;
            slotTrack.appendChild(div);
        });
        const slotWidth = 116;
        const containerWidth = document.querySelector('.slot-machine').clientWidth;
        const extraSpin = 1600 + Math.random() * 1000;
        const finalOffset = -extraSpin;
        slotTrack.style.transition = 'none';
        slotTrack.style.transform = 'translateX(0px)';
        setTimeout(() => {
            slotTrack.style.transition = 'transform cubic-bezier(0.1, 0.9, 0.2, 1.05) 2.8s';
            slotTrack.style.transform = `translateX(${finalOffset}px)`;
        }, 20);
        modal.classList.add('active');
        resultMsg.innerHTML = "🎰 Барабан крутится...";
        const finishHandler = () => {
            slotTrack.removeEventListener('transitionend', finishHandler);
            const transform = slotTrack.style.transform;
            const match = transform.match(/translateX\(([-\d.]+)px\)/);
            if (!match) return;
            let currentX = parseFloat(match[1]);
            const firstSlot = slotTrack.children[0];
            const itemWidth = firstSlot.offsetWidth + 16;
            let bestIndex = 0, bestDistance = Infinity;
            for (let i = 0; i < slotItems.length; i++) {
                const slotCenter = currentX + i * itemWidth + itemWidth/2;
                const distance = Math.abs(slotCenter - containerWidth/2);
                if (distance < bestDistance) { bestDistance = distance; bestIndex = i; }
            }
            const wonItem = slotItems[bestIndex];
            let rewardText = '', historyEntry = '';
            if (wonItem.type === 'ton') {
                addTonToUser(wonItem.value);
                rewardText = `💰 Выигрыш: ${wonItem.value} TON`;
                historyEntry = `🎲 Кейс за ${casePrice} TON → Выигрыш: ${wonItem.value} TON`;
            } else if (wonItem.type === 'rare') {
                addRareGiftToUser(wonItem.giftId);
                rewardText = `🎁 Подарок: ${wonItem.giftName}`;
                historyEntry = `🎲 Кейс за ${casePrice} TON → Подарок: ${wonItem.giftName}`;
            } else {
                addNftToUser(wonItem.nftData);
                rewardText = `💎 NFT: ${wonItem.nftData.name}`;
                historyEntry = `🎲 Кейс за ${casePrice} TON → NFT: ${wonItem.nftData.name}`;
            }
            resultMsg.innerHTML = rewardText;
            addHistoryEntry(historyEntry);
            updateBalanceUI();
            if (onComplete) onComplete();
        };
        slotTrack.addEventListener('transitionend', finishHandler, { once: true });
        setTimeout(() => finishHandler(), 3000);
    }
    
    // Оплата кейса через TON Connect (прямая оплата)
    async function payForCase(casePrice, onSuccess) {
        if (!tonConnectUI) { alert("TON Connect не инициализирован"); return; }
        const wallet = tonConnectUI.account;
        if (!wallet) {
         
            await tonConnectUI.connectWallet();
            if (!tonConnectUI.account) { alert("Не удалось подключить кошелёк"); return; }
        }
        const amountNano = (casePrice * 1e9).toString();
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 300,
            messages: [{
                address: PROJECT_WALLET_ADDRESS,
                amount: amountNano,
                
            }]
        };
        try {
            await tonConnectUI.sendTransaction(transaction);
            onSuccess();
        } catch (e) {
            console.error(e);
            alert("Оплата отклонена или ошибка");
        }
    }
    
    // Пополнение баланса через TON Connect
    async function depositBalance(amountTon) {
        if (!tonConnectUI) { alert("TON Connect не инициализирован"); return; }
        const wallet = tonConnectUI.account;
        if (!wallet) {
        
            await tonConnectUI.connectWallet();
            if (!tonConnectUI.account) { alert("Не удалось подключить кошелёк"); return; }
        }
        const amountNano = (amountTon * 1e9).toString();
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 300,
            messages: [{
                address: PROJECT_WALLET_ADDRESS,
                amount: amountNano,
                payload: "Пополнение баланса"
            }]
        };
        try {
            await tonConnectUI.sendTransaction(transaction);
            addTonToUser(amountTon);
            alert(`✅ Баланс пополнен на ${amountTon} TON!`);
            document.getElementById('depositModal').classList.remove('active');
        } catch (e) {
            console.error(e);
            alert("Ошибка платежа или отмена");
        }
    }
    
    function openCase(caseObj) {
        payForCase(caseObj.price, () => {
            spinSlot(caseObj.price, () => {});
        });
    }
    
    function renderCases() {
        const container = document.getElementById('casesContainer');
        container.innerHTML = '';
        CASES.forEach(c => {
            const div = document.createElement('div');
            div.className = 'case-item';
            div.innerHTML = `
                <div class="case-3d-icon">${c.icon}</div>
                <div class="case-title">${c.name}</div>
                <div class="case-price">${c.price} TON</div>
                <div class="case-drops" onclick="alert('${c.name}\\nШансы: 60% TON, 25% редкий подарок, 15% NFT')">📋 Таблица дропов</div>
                <button class="btn-open" data-id="${c.id}">ОТКРЫТЬ (${c.price} TON)</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.btn-open').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                const caseData = CASES.find(c => c.id === id);
                if (caseData) openCase(caseData);
            });
        });
    }
    
    // Инвентарь
    function renderInventoryModal() {
        const container = document.getElementById('inventoryModalList');
        const user = getUserData();
        container.innerHTML = '';
        for (const g of RARE_GIFTS) {
            const count = user.inventory[g.id] || 0;
            if (count > 0) {
                const rarityClass = g.rarity === 'common' ? 'rarity-common' : (g.rarity === 'rare' ? 'rarity-rare' : (g.rarity === 'epic' ? 'rarity-epic' : 'rarity-legendary'));
                const rarityName = { common:'Обычный', rare:'Редкий', epic:'Эпический', legendary:'Легендарный' }[g.rarity];
                const imgHtml = g.image ? `<img src="${g.image}">` : `<div style="font-size:2rem;">${g.icon}</div>`;
                container.innerHTML += `<div class="gift-card"><div class="gift-info"><div class="gift-icon">${imgHtml}</div><div class="gift-details"><div class="gift-name">${g.name}</div><div><span class="gift-rarity ${rarityClass}">${rarityName}</span></div><div class="gift-value">💰 ${g.valueTon} TON</div><div>📦 ${count}</div></div></div><div><button class="withdrawRareBtn" data-gift-id="${g.id}">ВЫВЕСТИ 1</button><button class="sellRareBtn" data-gift-id="${g.id}" data-value="${g.valueTon}">ПРОДАТЬ 1</button></div></div>`;
            }
        }
        user.inventory.nft.forEach((nft, idx) => {
            const imgHtml = nft.image ? `<img src="${nft.image}">` : `<div style="font-size:2rem;">${nft.icon || '🏷️'}</div>`;
            container.innerHTML += `<div class="gift-card"><div class="gift-info"><div class="gift-icon">${imgHtml}</div><div class="gift-details"><div class="gift-name">${nft.name}</div><div><span class="gift-rarity rarity-legendary">NFT</span></div><div class="gift-value">💰 ${nft.valueTon} TON</div></div></div><div><button class="withdrawNftBtn" data-idx="${idx}">ВЫВЕСТИ</button><button class="sellNftBtn" data-idx="${idx}" data-value="${nft.valueTon}">ПРОДАТЬ</button></div></div>`;
        });
        if (container.innerHTML === '') container.innerHTML = '<div style="padding:20px;">Нет подарков</div>';
        
        document.querySelectorAll('.withdrawRareBtn').forEach(btn => {
            btn.addEventListener('click', () => { if(removeRareGift(btn.dataset.giftId)) { alert("Подарок отправлен"); renderInventoryModal(); } });
        });
        document.querySelectorAll('.sellRareBtn').forEach(btn => {
            btn.addEventListener('click', () => { if(removeRareGift(btn.dataset.giftId)) { addTonToUser(parseFloat(btn.dataset.value)); alert("Продан"); renderInventoryModal(); } });
        });
        document.querySelectorAll('.withdrawNftBtn').forEach(btn => {
            btn.addEventListener('click', () => { if(removeNftItem(parseInt(btn.dataset.idx))) { alert("NFT отправлен"); renderInventoryModal(); } });
        });
        document.querySelectorAll('.sellNftBtn').forEach(btn => {
            btn.addEventListener('click', () => { if(removeNftItem(parseInt(btn.dataset.idx))) { addTonToUser(parseFloat(btn.dataset.value)); alert("Продан"); renderInventoryModal(); } });
        });
    }
    
    // Модалка пополнения
    let selectedAmount = null;
    function showDepositModal() {
        document.getElementById('depositModal').classList.add('active');
        // выбор суммы
        document.querySelectorAll('.amount-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.addEventListener('click', () => {
                document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAmount = parseFloat(btn.dataset.amount);
                document.getElementById('customAmount').value = '';
            });
        });
        document.getElementById('customAmount').addEventListener('input', (e) => {
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            selectedAmount = parseFloat(e.target.value);
            if (isNaN(selectedAmount)) selectedAmount = null;
        });
        document.getElementById('confirmDepositBtn').onclick = async () => {
            let amount = selectedAmount;
            if (!amount || amount <= 0) {
                const custom = parseFloat(document.getElementById('customAmount').value);
                if (!isNaN(custom) && custom > 0) amount = custom;
            }
            if (!amount || amount <= 0) { alert("Выберите сумму"); return; }
            await depositBalance(amount);
        };
    }
    
    function init() {
        initTonConnect();
        initGiftsArrays();
        loadAllData();
        initCurrentUser();
        renderCases();
        updateBalanceUI();
        
        document.getElementById('plusBalanceBtn').onclick = showDepositModal;
        document.getElementById('closeDepositModalBtn').onclick = () => document.getElementById('depositModal').classList.remove('active');
        document.getElementById('goToBankBtn').onclick = () => window.open('https://t.me/riskgift_bank', '_blank');
        document.getElementById('inventoryMainBtn').onclick = () => { renderInventoryModal(); document.getElementById('inventoryModal').classList.add('active'); };
        document.getElementById('closeInventoryModalBtn').onclick = () => document.getElementById('inventoryModal').classList.remove('active');
        document.getElementById('closeSlotBtn').onclick = () => document.getElementById('slotModal').classList.remove('active');
    }
    init();
</script>


</div>
</body>
