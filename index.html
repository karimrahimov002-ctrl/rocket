<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftBattle Style</title>

<style>
body{
  margin:0;
  background:#0e0e0e;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{margin-top:20px;}

.panel{
  background:#1c1c1c;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

button{
  padding:12px 18px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#4c6fff;
  color:white;
  cursor:pointer;
}

button:hover{background:#3a57d1;}

.battle{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.player{
  width:40%;
  background:#222;
  padding:10px;
  border-radius:10px;
}

.reel{
  width:90%;
  margin:20px auto;
  overflow:hidden;
  border:2px solid #333;
  border-radius:12px;
  height:130px;
  position:relative;
}

.line{
  display:flex;
  transition: transform 4s cubic-bezier(.12,.85,.25,1);
}

.item{
  min-width:130px;
  height:110px;
  margin:10px;
  background:#2a2a2a;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.center{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:2px;
  background:red;
  transform:translateX(-50%);
}

.inv{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.box{
  background:#2a2a2a;
  padding:8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<h1>🎁 GIFT BATTLE</h1>

<div class="panel">
💰 Баланс: <span id="bal">10</span>
</div>

<div class="panel">
<button onclick="startBattle()">⚔ START BATTLE</button>
</div>

<div class="battle">
  <div class="player">
    <h3>YOU</h3>
    <div id="youItem">-</div>
  </div>

  <div class="player">
    <h3>BOT</h3>
    <div id="botItem">-</div>
  </div>
</div>

<div class="reel">
<div class="center"></div>
<div class="line" id="line"></div>
</div>

<h3 id="result"></h3>

<div class="panel">
<h3>📦 Inventory</h3>
<div class="inv" id="inv"></div>
</div>

<script>

let balance = 10;
let inventory = [];

const items = [
  {name:"🎁 Gift", value:1},
  {name:"💎 Rare Gift", value:3},
  {name:"⭐ Epic Gift", value:5},
  {name:"🔥 Legendary Gift", value:10}
];

function render(){
  document.getElementById("bal").innerText = balance;

  const inv = document.getElementById("inv");
  inv.innerHTML = "";

  inventory.forEach(i=>{
    const d = document.createElement("div");
    d.className="box";
    d.innerText = i.name + " +" + i.value;
    inv.appendChild(d);
  });
}

function buildLine(){
  const line = document.getElementById("line");
  line.innerHTML = "";

  for(let i=0;i<35;i++){
    const el = document.createElement("div");
    el.className="item";
    el.innerText = items[Math.floor(Math.random()*items.length)].name;
    line.appendChild(el);
  }
}

/* ================= BATTLE ================= */
function startBattle(){

  if(balance < 5){
    alert("No balance");
    return;
  }

  balance -= 5;

  buildLine();

  const line = document.getElementById("line");
  const blocks = document.querySelectorAll(".item");

  const you = items[Math.floor(Math.random()*items.length)];
  const bot = items[Math.floor(Math.random()*items.length)];

  document.getElementById("youItem").innerText = you.name;
  document.getElementById("botItem").innerText = bot.name;

  const winIndex = Math.floor(Math.random()*20 + 8);
  blocks[winIndex].innerText = "🎁 WIN";

  const offset = -(winIndex*150 - 120);

  line.style.transform = `translateX(${offset}px)`;

  setTimeout(()=>{

    let winner;

    if(you.value > bot.value){
      winner = "YOU WIN";
      inventory.push(you);
      balance += you.value;
    } else if(bot.value > you.value){
      winner = "BOT WINS";
    } else {
      winner = "DRAW";
      balance += 2;
    }

    document.getElementById("result").innerText =
      "⚔ " + winner;

    render();

  }, 4200);
}

render();

</script>

</body>
</html>
