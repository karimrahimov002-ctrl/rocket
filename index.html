<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>NFT Case App</title>

  <style>
    body {
      font-family: Arial;
      background: #0e0e0e;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .panel {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #4c6fff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    .case-wrapper {
      overflow: hidden;
      width: 100%;
      border-radius: 12px;
      background: #111;
      border: 2px solid #333;
      position: relative;
      margin-top: 20px;
    }

    .line {
      display: flex;
      width: max-content;
      transition: transform 4s cubic-bezier(0.12, 0.85, 0.25, 1);
    }

    .item {
      width: 130px;
      height: 120px;
      margin: 10px;
      background: #2a2a2a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      text-align: center;
    }

    .center {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: red;
      transform: translateX(-50%);
    }

    .win {
      margin-top: 15px;
      color: #00ff99;
      font-size: 18px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      width: 80%;
    }
  </style>
</head>

<body>

<h1>🎁 NFT Case System</h1>

<div class="panel">
  <div id="balance">Баланс: ...</div>

  <button onclick="login()">Login</button>
  <button onclick="openCase()">Open NFT Case</button>
</div>

<div class="case-wrapper">
  <div class="center"></div>
  <div class="line" id="line"></div>
</div>

<div class="win" id="win"></div>

<div class="panel">
  <h3>📦 Withdraw NFT</h3>
  <input id="item" placeholder="Название предмета"/>
  <button onclick="withdraw()">Send Withdraw Request</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const API = window.location.origin;
let user = null;

/* NFT items */
const items = [
  "🎁 Telegram Gift",
  "💎 NFT Rare Gift",
  "⭐ Premium Gift",
  "🔥 Legendary Gift",
  "🎉 Common Gift"
];

function buildLine() {
  const line = document.getElementById("line");
  line.innerHTML = "";

  for (let i = 0; i < 30; i++) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerText = items[Math.floor(Math.random() * items.length)];
    line.appendChild(el);
  }
}

/* LOGIN */
async function login() {
  const res = await fetch(API + "/auth", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(tg.initDataUnsafe)
  });

  user = await res.json();
  document.getElementById("balance").innerText =
    "Баланс: " + user.balance;
}

/* OPEN CASE */
async function openCase() {
  if (!user) return alert("login first");

  document.getElementById("win").innerText = "";

  const res = await fetch(API + "/open/" + user.telegram_id, {
    method: "POST"
  });

  const data = await res.json();

  document.getElementById("balance").innerText =
    "Баланс: " + data.balance;

  animateRoll(data.reward);
}

/* CS STYLE ROLL */
function animateRoll(reward) {
  buildLine();

  const line = document.getElementById("line");
  const itemsDOM = document.querySelectorAll(".item");

  const winIndex = Math.floor(Math.random() * 20 + 5);

  itemsDOM[winIndex].innerText = "🎁 WIN NFT";

  const offset = -(winIndex * 150 - 120);

  line.style.transform = `translateX(${offset}px)`;

  setTimeout(() => {
    document.getElementById("win").innerText =
      "🎉 Выпал NFT подарок!";
  }, 4200);
}

/* WITHDRAW REQUEST */
async function withdraw() {
  if (!user) return alert("login first");

  const item = document.getElementById("item").value;

  if (!item) return alert("Введите предмет");

  const res = await fetch(API + "/withdraw", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      telegram_id: user.telegram_id,
      item: item
    })
  });

  const data = await res.json();

  alert("Заявка отправлена: " + data.status);
}
</script>

</body>
</html>
