<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background: radial-gradient(circle at top,#2e1065,#020617);
}

canvas#stars{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.container{max-width:900px;margin:auto;padding:15px;}

.balance{
  display:flex;justify-content:space-between;
  background:#0f172a;padding:10px;border-radius:10px;
}

.tabs{display:flex;gap:10px;margin-top:10px;}
.tab{flex:1;padding:10px;background:#1e293b;border-radius:10px;text-align:center;cursor:pointer;}
.active{background:#7c3aed;}

.screen{display:none;}
.activeScreen{display:block;}

.mult{
  font-size:50px;
  text-align:center;
  margin:10px 0;
}

#graph{
  width:100%;height:260px;background:black;border-radius:10px;position:relative;
}
#rocket{
  position:absolute;
  font-size:22px;
}

.controls{
  display:flex;gap:10px;margin-top:10px;
}
input{flex:1;padding:10px;border-radius:6px;border:none;}

.players{
  margin-top:10px;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  max-height:200px;
  overflow:auto;
}

.player{display:flex;justify-content:space-between;font-size:14px;}

.history{
  display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;
}
.history span{
  background:#1e293b;padding:5px;border-radius:6px;
}

.deposit{
  margin-top:20px;background:#0f172a;padding:10px;border-radius:10px;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">

<div class="balance">
  <div>Баланс: <b id="balance">1000</b> TON</div>
  <button onclick="openTab('gift')">Пополнить</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="openTab('rocket')">🚀 Ракетка</div>
  <div class="tab" onclick="openTab('cases')">📦 Кейсы</div>
  <div class="tab" onclick="openTab('gift')">🎁 Подарок</div>
</div>

<div id="rocketScreen" class="screen activeScreen">

<div class="mult" id="mult">Ожидание...</div>

<div id="graph">
  <canvas id="g"></canvas>
  <div id="rocket">🚀</div>
</div>

<div class="controls">
  <input type="number" id="bet" value="100">
  <button onclick="placeBet()">Ставка</button>
  <button onclick="cashOut()">Забрать</button>
</div>

<div class="players" id="players"></div>
<div class="history" id="history"></div>

</div>

<div id="cases" class="screen">
  <div style="margin-top:40px;text-align:center;font-size:24px;">📦 Скоро</div>
</div>

<div id="gift" class="screen">
  <div class="deposit">
    📩 Отправьте подарок в Telegram: <b>@riskgift_bot</b><br>
    После этого вам придут TON на баланс автоматически
  </div>
</div>

</div>

<script>

/* ===== STARS ===== */
let sctx=stars.getContext("2d");
let s=[];
for(let i=0;i<200;i++){
  s.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight});
}
function starLoop(){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  s.forEach(st=>{
    sctx.fillRect(st.x,st.y,2,2);
    st.y+=0.2;
    if(st.y>innerHeight) st.y=0;
  });
  requestAnimationFrame(starLoop);
}
starLoop();

/* ===== TABS ===== */
function openTab(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("activeScreen"));
  document.getElementById(id==="rocket"?"rocketScreen":id).classList.add("activeScreen");
}

/* ===== STATE ===== */
let phase="waiting"; // waiting | playing
let timer=5;
let multiplier=1;

let players=[];
let history=[];
let myBet=0;
let myActive=false;

/* ===== PLAYERS ===== */
let names=["Alex","Ivan","Misha","Vlad","Nikita","Sasha","Oleg","Max"];

function genPlayers(){
  players=[];
  for(let i=0;i<20;i++){
    players.push({
      name:names[Math.random()*names.length|0],
      bet:Math.floor(Math.random()*1000)+50,
      exit:(Math.random()*3+1),
      status:"playing"
    });
  }
}

/* ===== RENDER ===== */
function renderPlayers(){
  let el=playersDiv;
  el.innerHTML="";
  players.forEach(p=>{
    let div=document.createElement("div");
    div.className="player";
    let status = p.status==="cash"?"✅":(p.status==="lost"?"❌":"");
    div.innerHTML = `${p.name} — ${p.bet} TON ${status}`;
    el.appendChild(div);
  });
}

/* ===== HISTORY ===== */
function renderHistory(){
  historyDiv.innerHTML="";
  history.forEach(h=>{
    let s=document.createElement("span");
    s.innerText=h+"x";
    historyDiv.appendChild(s);
  });
}

/* ===== GRAPH ===== */
let ctx=g.getContext("2d");
let pts=[],gx=0;

function drawGraph(){
  ctx.clearRect(0,0,1000,260);
  ctx.beginPath();
  ctx.strokeStyle="lime";

  pts.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });

  ctx.stroke();

  let last=pts[pts.length-1];
  if(last){
    rocket.style.left=last.x+"px";
    rocket.style.top=last.y+"px";
  }
}

/* ===== LOOP ===== */
function loop(){
  requestAnimationFrame(loop);

  if(phase==="waiting"){
    mult.innerText="Старт через "+timer+"с";
    return;
  }

  multiplier *= 1.01; // экспонента

  let crashChance = 0.015 + multiplier*0.01;

  if(Math.random()<crashChance){
    crash();
    return;
  }

  mult.innerText=multiplier.toFixed(2)+"x";

  gx+=2;
  pts.push({x:gx,y:260 - multiplier*30});

  players.forEach(p=>{
    if(p.status==="playing" && multiplier>=p.exit){
      p.status="cash";
    }
  });

  drawGraph();
  renderPlayers();
}

/* ===== ROUND ===== */
function startRound(){
  phase="playing";
  multiplier=1;
  gx=0;
  pts=[];
  genPlayers();
}

function crash(){
  phase="waiting";

  players.forEach(p=>{
    if(p.status==="playing") p.status="lost";
  });

  history.unshift(multiplier.toFixed(2));
  if(history.length>15) history.pop();

  renderHistory();

  timer=5;
  let countdown=setInterval(()=>{
    timer--;
    if(timer<=0){
      clearInterval(countdown);
      startRound();
    }
  },1000);
}

/* ===== BET ===== */
function placeBet(){
  myBet=+bet.value;
  myActive=true;
}

function cashOut(){
  if(!myActive) return;
  alert("Ты забрал "+Math.floor(myBet*multiplier)+" TON");
  myActive=false;
}

/* INIT */
const playersDiv=document.getElementById("players");
const historyDiv=document.getElementById("history");
const mult=document.getElementById("mult");

startRound();
loop();

</script>

</body>
</html>
