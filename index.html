<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Risk Gift</title>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background: radial-gradient(circle,#2e1065,#020617);
  overflow:hidden;
}

/* ===== COMMON ===== */
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  height:100vh;
}

.btn3d{
  padding:15px 25px;
  border-radius:15px;
  background:linear-gradient(145deg,#7c3aed,#5b21b6);
  box-shadow:0 8px 0 #3b0764, 0 15px 30px rgba(0,0,0,0.5);
  cursor:pointer;
  transition:0.1s;
}
.btn3d:active{
  transform:translateY(6px);
  box-shadow:0 3px 0 #3b0764;
}

/* ===== MENU ===== */
#menu h1{
  font-size:40px;
  margin-bottom:20px;
}

.cards{
  display:flex;
  gap:20px;
}

.card{
  width:150px;
  height:120px;
  border-radius:20px;
  background:#1e293b;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  cursor:pointer;
  transition:0.2s;
}
.card:active{
  transform:scale(0.95);
}

.soon{
  font-size:12px;
  opacity:0.6;
}

/* ===== GAME ===== */
#game{
  display:none;
  height:100vh;
  flex-direction:column;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#0f172a;
}

#mult{
  text-align:center;
  font-size:50px;
  margin-top:10px;
}

#rocket{
  text-align:center;
  font-size:60px;
  transition:transform 0.1s linear;
}

.controls{
  display:flex;
  gap:10px;
  padding:10px;
}

input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
}

.players{
  flex:1;
  overflow:auto;
  padding:10px;
}

.player{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:14px;
}

.disabled{
  opacity:0.5;
  pointer-events:none;
}
</style>
</head>

<body>

<!-- ===== MENU ===== -->
<div id="menu" class="center">
  <h1>Risk Gift</h1>

  <div class="cards">
    <div class="card" onclick="openGame()">
      🚀<br>Ракетка
    </div>

    <div class="card">
      📦 Кейсы
      <div class="soon">Скоро</div>
    </div>
  </div>
</div>

<!-- ===== GAME ===== -->
<div id="game">

  <div class="top">
    <div>Баланс: <span id="balance">10</span> TON</div>
    <div id="wallet">Connect Wallet</div>
  </div>

  <div id="ton-connect" style="padding:10px;"></div>

  <div id="mult">1.00x</div>
  <div id="rocket">🚀</div>

  <div class="controls">
    <input id="bet" type="number" value="100">
    <button class="btn3d" onclick="placeBet()">Ставка</button>
    <button class="btn3d" id="cashBtn" onclick="cash()">Забрать</button>
  </div>

  <div class="players" id="players"></div>

</div>

<script>

/* ===== TON ===== */
const ton = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl:'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json',
  buttonRootId:'ton-connect'
});

ton.onStatusChange(w=>{
  if(w){
    wallet.innerText="Wallet: "+w.account.address.slice(0,6)+"...";
  }
});

/* ===== NAV ===== */
function openGame(){
  menu.style.display="none";
  game.style.display="flex";
}

/* ===== GAME ===== */
let mult=1;
let running=false;
let myBet=0;
let canCash=false;

/* FAKE PLAYERS */
let names=["teuh","vika","Vlad","govorasha","yord","kerix","gfeu"];

function genPlayers(){
  players.innerHTML="";
  for(let i=0;i<15;i++){
    let div=document.createElement("div");
    div.className="player";
    div.innerHTML = names[Math.random()*names.length|0] +
      " — "+(Math.random()*500|0)+" TON";
    players.appendChild(div);
  }
}

/* LOOP */
function startRound(){
  mult=1;
  running=true;
  canCash=false;
  cashBtn.classList.add("disabled");

  genPlayers();
}

function loop(){
  requestAnimationFrame(loop);

  if(!running) return;

  mult *= 1.002;

  let crashChance = 0.01 + mult*0.008;

  if(Math.random()<crashChance){
    running=false;
    multEl.innerText="💥 "+mult.toFixed(2);

    setTimeout(startRound,2000);
    return;
  }

  if(mult>1.2){
    canCash=true;
    cashBtn.classList.remove("disabled");
  }

  multEl.innerText=mult.toFixed(2)+"x";

  /* rocket animation */
  rocket.style.transform =
    "translateY(" + (-mult*5) + "px) rotate(" + (mult*10) + "deg)";
}

/* BET */
function placeBet(){
  let b=+bet.value;

  if(balance.innerText < b) return;

  balance.innerText -= b;
  myBet=b;
}

/* CASH */
function cash(){
  if(!canCash) return;

  let win = Math.floor(myBet * mult);
  balance.innerText = +balance.innerText + win;

  canCash=false;
}

/* INIT */
const multEl=document.getElementById("mult");

startRound();
loop();

</script>

</body>
</html>
