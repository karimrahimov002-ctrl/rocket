<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Up - Premium TON Cases</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161c26;
            --ton-blue: #0088cc;
            --ton-glow: #00aaff;
            --text-main: #ffffff;
            --text-muted: #707e94;
            --accent-gold: #f3ba2f;
            --accent-purple: #9b51e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        .balance-container {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .balance-container span {
            color: var(--ton-glow);
        }

        /* Главный экран / Баннер */
        .welcome-hero {
            padding: 24px 16px;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 136, 204, 0.15) 0%, transparent 70%);
        }

        .welcome-hero h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #fff, var(--ton-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Сетка кейсов */
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 16px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .case-card:active {
            transform: scale(0.98);
        }

        /* Стили для разных кейсов */
        .case-card.bronze { border-left: 4px solid #cd7f32; box-shadow: 0 4px 20px rgba(205, 127, 50, 0.1); }
        .case-card.silver { border-left: 4px solid #c0c0c0; box-shadow: 0 4px 20px rgba(192, 192, 192, 0.1); }
        .case-card.gold { border-left: 4px solid var(--accent-gold); box-shadow: 0 4px 20px rgba(243, 186, 47, 0.1); }
        .case-card.platinum { border-left: 4px solid #e5e4e2; box-shadow: 0 4px 20px rgba(229, 228, 226, 0.1); }
        .case-card.neon { border-left: 4px solid var(--accent-purple); box-shadow: 0 4px 20px rgba(155, 81, 224, 0.2); }

        .case-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .case-price {
            font-weight: bold;
            color: var(--ton-glow);
        }

        /* 3D Имитация Куба (CSS) */
        .cube-container {
            width: 50px;
            height: 50px;
            perspective: 400px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 6s infinite linear;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.8;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .bronze .face { background: #cd7f32; }
        .silver .face { background: #c0c0c0; }
        .gold .face { background: var(--accent-gold); }
        .platinum .face { background: #e5e4e2; }
        .neon .face { background: var(--accent-purple); }

        .front  { transform: translateZ(25px); }
        .back   { transform: rotateY(180deg) translateZ(25px); }
        .top    { transform: rotateX(90deg) translateZ(25px); }
        .bottom { transform: rotateX(-90deg) translateZ(25px); }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* Модальное окно открытия кейса (Рулетка) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 20, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 120px;
            background: #1c2431;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
        }

        .pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--ton-glow);
            z-index: 10;
            box-shadow: 0 0 10px var(--ton-glow);
            transform: translateX(-50%);
        }

        .roulette-tape {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            will-change: transform;
        }

        .roulette-item {
            width: 90px;
            height: 90px;
            background: var(--card-bg);
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .roulette-item.ton-drop { border-color: var(--ton-glow); color: var(--ton-glow); }
        .roulette-item.nft-drop { border-color: var(--accent-purple); color: var(--accent-purple); }
        .roulette-item.item-drop { border-color: var(--accent-gold); color: var(--accent-gold); }

        .modal-buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary { background: var(--ton-blue); color: #fff; }
        .btn-secondary { background: var(--card-bg); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }

        /* Нижнее меню навигации */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: #121822;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--ton-glow);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* Скрытые экраны */
        .screen { display: none; padding: 16px; }
        .screen.active { display: block; }

        .gift-info-box {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px dashed var(--ton-glow);
            font-size: 14px;
            line-height: 1.4;
        }

        .inventory-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .inv-item {
            background: var(--card-bg);
            padding: 12px 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <!-- НАВИГАЦИОННАЯ ШАПКА -->
    <header>
        <div style="font-weight: 900; font-size: 18px; tracking-wide">MINI UP</div>
        <div class="balance-container">
            <span id="user-balance">50.00</span> TON
        </div>
    </header>

    <!-- ЭКРАН 1: КЕЙСЫ (ГЛАВНЫЙ) -->
    <div id="screen-cases" class="screen active">
        <div class="welcome-hero">
            <h1>УДАЧА ЖДЕТ ТЕБЯ</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Открывай кейсы, забирай TON и редкие Telegram NFT Gifts</p>
        </div>

        <div class="cases-grid">
            <!-- Кейс 1 -->
            <div class="case-card bronze" onclick="openCaseLogic('Bronze Spark', 1)">
                <div class="case-info">
                    <h3>Bronze Spark</h3>
