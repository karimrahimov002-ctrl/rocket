<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Riskgift — кейсы с подарками Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0b0e1a, #03050b);
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            color: #f0f3ff;
            padding: 16px 12px 32px;
        }
        .glow { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff8; }
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(0, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0); }
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid rgba(0,255,255,0.2);
        }
        .balance-box {
            background: #00000055;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plus-btn {
            background: cyan;
            color: black;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
            transition: 0.2s;
            box-shadow: 0 0 8px cyan;
        }
        .plus-btn:hover { transform: scale(1.05); }
        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: cyan;
            font-size: 1.5rem;
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .inventory-btn {
            background: linear-gradient(90deg, #7a5ac5, #4a2a8a);
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            width: 100%;
            margin: 12px 0;
            cursor: pointer;
            text-align: center;
        }
        /* Табы */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            padding-bottom: 8px;
        }
        .tab-btn {
            background: transparent;
            color: #ccc;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 40px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: rgba(0,255,255,0.2);
            color: cyan;
            box-shadow: 0 0 8px cyan;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Кейсы 2 ряда */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 8px 4px;
        }
        .case-item {
            background: linear-gradient(145deg, #11161f, #080c14);
            border-radius: 28px;
            padding: 14px 10px;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .case-item:hover {
            transform: translateY(-3px);
            border-color: cyan;
            box-shadow: 0 8px 20px -6px #0ff3;
        }
        .case-3d-icon { font-size: 2.5rem; filter: drop-shadow(0 0 4px cyan); margin: 6px 0; }
        .case-title { font-weight: 700; font-size: 0.9rem; }
        .case-price { color: #ffd966; font-weight: bold; margin: 4px 0; font-size: 0.85rem; }
        .case-drops {
            font-size: 0.6rem;
            background: #00000066;
            border-radius: 16px;
            padding: 4px;
            margin: 6px 0;
            cursor: pointer;
            color: #aaffdd;
        }
        .btn-open {
            background: linear-gradient(90deg, #0ff, #0a7eff);
            border: none;
            padding: 6px 10px;
            border-radius: 40px;
            font-weight: bold;
            color: #000;
            width: 100%;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: #0a0f1ae0;
            backdrop-filter: blur(20px);
            border-radius: 40px;
            width: 90%;
            max-width: 500px;
            padding: 20px 16px;
            border: 1px solid cyan;
            text-align: center;
        }
        .roulette-container {
            margin: 15px 0;
            overflow-x: hidden;
            background: #00000066;
            border-radius: 60px;
            padding: 8px 0;
        }
        .roulette-track {
            display: flex;
            gap: 12px;
            will-change: transform;
            transition: transform cubic-bezier(0.2, 0.9, 0.4, 1.05) 2.2s;
        }
        .roulette-slot {
            background: rgba(0, 255, 255, 0.15);
            border-radius: 40px;
            padding: 10px 16px;
            min-width: 100px;
            text-align: center;
            font-weight: bold;
            border: 1px solid cyan;
            white-space: nowrap;
            font-size: 0.8rem;
        }
        .inventory-list, .history-list {
            max-height: 400px;
            overflow-y: auto;
            margin: 12px 0;
            padding-right: 4px;
        }
        .gift-card {
            background: linear-gradient(135deg, #0f1422, #0a0e1a);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 3px solid cyan;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .gift-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .gift-icon { font-size: 2rem; }
        .gift-details { text-align: left; }
        .gift-name { font-weight: bold; font-size: 1rem; }
        .gift-rarity {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
        }
        .rarity-common { background: #3a6ea5; }
        .rarity-rare { background: #7a5ac5; }
        .rarity-epic { background: #c97e00; }
        .rarity-legendary { background: #c41e3a; }
        .gift-value { color: #ffd966; font-size: 0.8rem; }
        button {
            background: linear-gradient(90deg, #0ff, #0a6cff);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .close-btn, .secondary-btn { background: #222; color: white; }
        .flex-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        hr { border-color: #0ff33f; margin: 10px 0; }
        .bank-link {
            display: inline-block;
            margin: 8px 0;
            background: #2a2e4a;
            color: white;
        }
        .history-item {
            background: linear-gradient(135deg, #0f1422, #0a0e1a);
            border-radius: 24px;
            padding: 10px 16px;
            margin-bottom: 8px;
            border-left: 3px solid cyan;
        }
    </style>
</head>
<body>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="mainScreen">
    <div class="top-bar">
        <div class="balance-box">
            💰 <span id="userBalance">0.00</span> TON
            <div class="plus-btn" id="plusBalanceBtn">+</div>
        </div>
        <div>
            <!-- Кнопка инвентаря вынесена отдельно, но здесь оставим только иконку для быстрого доступа? Нет, по заданию кнопка отдельно, не рядом с пополнением. Сделаем большую кнопку внизу -->
        </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
        <h2>⚡ КЕЙСЫ (до 25 TON)</h2>
        <button id="goToBankBtn" style="background: #2a2e4a; font-size: 0.7rem;">🏦 Банк подарков</button>
    </div>
    
    <!-- Отдельная большая кнопка ИНВЕНТАРЬ -->
    <button id="inventoryMainBtn" class="inventory-btn">📦 МОЙ ИНВЕНТАРЬ (подарки и NFT)</button>
    
    <!-- Табы: Кейсы / История (инвентарь теперь отдельной кнопкой) -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="cases">🎲 КЕЙСЫ</button>
        <button class="tab-btn" data-tab="history">🏆 ИСТОРИЯ ВЫИГРЫШЕЙ</button>
    </div>
    <div id="tabCases" class="tab-content active">
        <p style="font-size: 0.7rem; margin-bottom: 12px;">70% TON / 20% Редкий подарок / 10% NFT | Нажми на кейс — крути рулетку!</p>
        <div class="cases-grid" id="casesContainer"></div>
    </div>
    <div id="tabHistory" class="tab-content">
        <p style="font-size: 0.7rem; margin-bottom: 12px;">Ваши последние выигрыши</p>
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<!-- МОДАЛКА РУЛЕТКИ -->
<div id="rouletteModal" class="modal">
    <div class="modal-content">
        <h3>🌀 ВРАЩЕНИЕ БАРАБАНА</h3>
        <div class="roulette-container"><div id="rouletteTrack" class="roulette-track"></div></div>
        <p id="rouletteResultMsg" style="margin-top: 10px;"></p>
        <button id="closeRouletteBtn" class="close-btn">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА ПОПОЛНЕНИЯ (ПЛЮС) - только инструкция и переход в банк -->
<div id="depositInfoModal" class="modal">
    <div class="modal-content">
        <h3>💰 ПОПОЛНЕНИЕ БАЛАНСА</h3>
        <p style="margin: 16px 0;">Отправьте любой ваш подарок в банк подарков <strong>@riskgift_bank</strong><br>После отправки вам начислят баланс.</p>
        <button id="goToBankFromDeposit" class="bank-link">🏦 Перейти в банк подарков</button>
        <div style="margin-top: 16px;">
            <button id="simulateDepositBtn" style="background: #3a2a6e;">✅ Я отправил подарок (получить TON)</button>
        </div>
        <button id="closeDepositInfoBtn" class="close-btn" style="margin-top: 16px;">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА ИНВЕНТАРЯ (отдельная, вызывается по кнопке) -->
<div id="inventoryModal" class="modal">
    <div class="modal-content" style="max-width: 550px;">
        <h3>📦 ВСЕ ВАШИ ПОДАРКИ И NFT</h3>
        <div id="inventoryModalList" class="inventory-list" style="max-height: 450px;"></div>
        <button id="closeInventoryModalBtn" class="close-btn">Закрыть</button>
    </div>
</div>

<script>
    // ========== КОНФИГУРАЦИЯ ==========
    const CASES = [
        { id:0, name:"Trash Case", price:0.1, icon:"🗑️", drops:["0.01-0.05 TON","Обычный подарок"] },
        { id:1, name:"Starter Pack", price:1, icon:"📦", drops:["0.1-0.5 TON","Редкий"] },
        { id:2, name:"Crypto Vortex", price:5, icon:"🌀", drops:["0.5-2.5 TON","Редкий"] },
        { id:15, name:"Neon Rush", price:5, icon:"⚡", drops:["0.6-2.8 TON","Xmas Stocking"] },
        { id:3, name:"Hype Blaze", price:10, icon:"🔥", drops:["1-5 TON","Редкий x2"] },
        { id:16, name:"Phantom Core", price:10, icon:"👻", drops:["1.2-6 TON","Lol Pop"] },
        { id:4, name:"Magnate", price:25, icon:"👑", drops:["2.5-12 TON","Редкий x3"] },
        { id:17, name:"Golden Era", price:25, icon:"🏆", drops:["3-13 TON","Гарант NFT 15%"] }
    ];

    const RARE_GIFTS = [
        { id:"xmas", name:"Xmas Stocking", icon:"🧦", rarity:"rare", valueTon:0.5 },
        { id:"clover", name:"Clover Pin", icon:"🍀", rarity:"rare", valueTon:0.4 },
        { id:"tama", name:"Tama Gadget", icon:"📟", rarity:"epic", valueTon:0.6 },
        { id:"calendar", name:"Desk Calendar", icon:"📅", rarity:"common", valueTon:0.35 },
        { id:"lol", name:"Lol Pop", icon:"😂", rarity:"rare", valueTon:0.45 },
        { id:"ice", name:"Ice Cream", icon:"🍦", rarity:"common", valueTon:0.55 },
        { id:"snoop", name:"Snoop Dogg", icon:"🐶", rarity:"legendary", valueTon:0.8 },
        { id:"golden", name:"Golden Ticket", icon:"🎫", rarity:"epic", valueTon:1.2 },
        { id:"dragon", name:"Dragon Scale", icon:"🐉", rarity:"legendary", valueTon:2.0 },
        { id:"phoenix", name:"Phoenix Feather", icon:"🔥", rarity:"legendary", valueTon:2.5 },
        { id:"crystal", name:"Crystal Heart", icon:"💎", rarity:"epic", valueTon:1.8 }
    ];

    const NFT_GIFTS = [
        { name:"Mad Pumpkin", valueTon:9.2, icon:"🎃" },
        { name:"Eternal Rose", valueTon:17.3, icon:"🌹" },
        { name:"Voodoo Doll", valueTon:26.3, icon:"🪆" },
        { name:"Sharp Tongue", valueTon:34.6, icon:"👅" },
        { name:"Kissed Frog", valueTon:36.0, icon:"🐸" },
        { name:"⭐ NFT Star", valueTon:5.0, icon:"⭐" },
        { name:"🔴 Red Diamond", valueTon:8.5, icon:"💎" },
        { name:"💠 Neon Vortex", valueTon:12.0, icon:"🌀" },
        { name:"👾 Alien Artifact", valueTon:19.5, icon:"👾" },
        { name:"🌙 Lunar Token", valueTon:22.0, icon:"🌙" }
    ];

    // Глобальные данные
    let allUsersData = {};
    let currentUser = null;
    let userHistory = [];

    function initInventoryObj() {
        let inv = {};
        RARE_GIFTS.forEach(g => inv[g.id] = 0);
        inv.nft = [];
        return inv;
    }

    function loadAllData() {
        const saved = localStorage.getItem('riskgift_allusers_v11');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                allUsersData = data.allUsers || {};
            } catch(e) {}
        }
        if (!allUsersData['default_user']) {
            allUsersData['default_user'] = { tonBalance: 20.0, inventory: initInventoryObj(), history: [] };
        }
    }
    function saveAllData() {
        localStorage.setItem('riskgift_allusers_v11', JSON.stringify({ allUsers: allUsersData }));
    }

    function initCurrentUser() {
        let tgUser = null;
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        }
        if (tgUser && tgUser.username) {
            currentUser = tgUser.username.toLowerCase();
        } else {
            let saved = localStorage.getItem('riskgift_temp_user');
            if (saved) currentUser = saved;
            else {
                currentUser = 'user_' + Math.floor(Math.random() * 100000);
                localStorage.setItem('riskgift_temp_user', currentUser);
            }
        }
        if (!allUsersData[currentUser]) {
            allUsersData[currentUser] = { tonBalance: 15.0, inventory: initInventoryObj(), history: [] };
        }
        userHistory = allUsersData[currentUser].history || [];
        saveAllData();
    }

    function getUserData() {
        return allUsersData[currentUser];
    }

    function updateBalanceUI() {
        const data = getUserData();
        document.getElementById('userBalance').innerText = data.tonBalance.toFixed(4);
    }

    function addHistoryEntry(entry) {
        userHistory.unshift(entry);
        if (userHistory.length > 20) userHistory.pop();
        allUsersData[currentUser].history = userHistory;
        saveAllData();
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (!container) return;
        container.innerHTML = '';
        if (userHistory.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">Пока нет выигрышей. Откройте кейс!</div>';
            return;
        }
        userHistory.forEach(entry => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = entry;
            container.appendChild(div);
        });
    }

    // Добавление выигрыша в инвентарь
    function addRareGiftToUser(giftId) {
        const user = getUserData();
        user.inventory[giftId] = (user.inventory[giftId] || 0) + 1;
        saveAllData();
    }
    function addNftToUser(nftObj) {
        const user = getUserData();
        user.inventory.nft.push({ ...nftObj });
        saveAllData();
    }
    function addTonToUser(amount) {
        const user = getUserData();
        user.tonBalance += amount;
        saveAllData();
        updateBalanceUI();
    }

    // Генерация выигрыша
    function generateReward(casePrice) {
        const rand = Math.random();
        if (rand < 0.7) {
            const percent = 0.1 + Math.random() * 0.4;
            let winTon = casePrice * percent;
            winTon = Math.round(winTon * 1000) / 1000;
            return { type:'ton', value:winTon, displayName:`${winTon.toFixed(3)} TON` };
        } else if (rand < 0.9) {
            const idx = Math.floor(Math.random() * RARE_GIFTS.length);
            const gift = RARE_GIFTS[idx];
            return { type:'rare_gift', giftId:gift.id, giftName:gift.name, icon:gift.icon, displayName:`${gift.icon} ${gift.name}` };
        } else {
            const idx = Math.floor(Math.random() * NFT_GIFTS.length);
            const nft = NFT_GIFTS[idx];
            return { type:'nft', nftData:nft, displayName:`✨ ${nft.name} (${nft.valueTon} TON)` };
        }
    }

    // Рулетка
    function showRoulette(casePrice, onComplete) {
        const rouletteTrack = document.getElementById('rouletteTrack');
        const resultMsg = document.getElementById('rouletteResultMsg');
        const modal = document.getElementById('rouletteModal');
        const reward = generateReward(casePrice);
        let slotItems = [];
        for(let i=0;i<8;i++) slotItems.push({ label:"❓ ???", type:"dummy" });
        for(let i=0;i<14;i++) slotItems.push({ label:`${(casePrice * (0.1 + Math.random()*0.4)).toFixed(2)} TON`, type:"ton" });
        RARE_GIFTS.forEach(g => { for(let i=0;i<5;i++) slotItems.push({ label:`${g.icon} ${g.name}`, type:g.id }); });
        NFT_GIFTS.forEach(nft => { for(let i=0;i<4;i++) slotItems.push({ label:`✨ ${nft.name}`, type:"nft" }); });
        slotItems = slotItems.sort(() => Math.random() - 0.5);
        let targetIndex = 0;
        if (reward.type === 'ton') targetIndex = slotItems.findIndex(item => item.type === 'ton');
        else if (reward.type === 'rare_gift') targetIndex = slotItems.findIndex(item => item.type === reward.giftId);
        else targetIndex = slotItems.findIndex(item => item.type === 'nft');
        if (targetIndex === -1) targetIndex = 4;
        targetIndex = Math.min(slotItems.length-1, Math.max(0, targetIndex));
        rouletteTrack.innerHTML = '';
        slotItems.forEach(item => { const div = document.createElement('div'); div.className = 'roulette-slot'; div.innerText = item.label; rouletteTrack.appendChild(div); });
        const slotWidth = 110, containerWidth = document.querySelector('.roulette-container').clientWidth, startOffset = containerWidth/2 - slotWidth/2;
        const targetOffset = -(targetIndex * slotWidth) + startOffset, extraSpin = 1500 + Math.random()*800;
        rouletteTrack.style.transition = 'none';
        rouletteTrack.style.transform = `translateX(0px)`;
        setTimeout(() => { rouletteTrack.style.transition = 'transform cubic-bezier(0.2, 0.9, 0.4, 1.05) 2.2s'; rouletteTrack.style.transform = `translateX(${targetOffset - extraSpin}px)`; }, 20);
        modal.classList.add('active');
        resultMsg.innerHTML = "🌀 Крутим...";
        const finishHandler = () => {
            rouletteTrack.removeEventListener('transitionend', finishHandler);
            let rewardText = '';
            let historyEntry = '';
            if (reward.type === 'ton') {
                addTonToUser(reward.value);
                rewardText = `💰 +${reward.value} TON`;
                historyEntry = `🎲 Кейс за ${casePrice} TON → Выигрыш: ${reward.value} TON`;
            } else if (reward.type === 'rare_gift') {
                addRareGiftToUser(reward.giftId);
                rewardText = `🎁 ${reward.displayName} добавлен в инвентарь!`;
                historyEntry = `🎲 Кейс за ${casePrice} TON → Подарок: ${reward.displayName}`;
            } else {
                addNftToUser(reward.nftData);
                rewardText = `💎 NFT: ${reward.displayName}`;
                historyEntry = `🎲 Кейс за ${casePrice} TON → NFT: ${reward.displayName}`;
            }
            resultMsg.innerHTML = rewardText;
            addHistoryEntry(historyEntry);
            if (onComplete) onComplete();
            updateBalanceUI();
        };
        rouletteTrack.addEventListener('transitionend', finishHandler, { once: true });
        setTimeout(() => finishHandler(), 2800);
    }

    function openCase(caseObj) {
        const user = getUserData();
        if (user.tonBalance < caseObj.price) { alert(`❌ Не хватает TON! Нужно ${caseObj.price} TON`); return; }
        user.tonBalance -= caseObj.price;
        saveAllData();
        updateBalanceUI();
        showRoulette(caseObj.price, () => {});
    }

    function renderCases() {
        const container = document.getElementById('casesContainer');
        container.innerHTML = '';
        CASES.forEach(c => {
            const div = document.createElement('div');
            div.className = 'case-item';
            div.innerHTML = `
                <div class="case-3d-icon">${c.icon}</div>
                <div class="case-title">${c.name}</div>
                <div class="case-price">${c.price} TON</div>
                <div class="case-drops" onclick="alert('${c.name}\\nВозможные выигрыши:\\n${c.drops.join('\\n')}\\n\\n70% TON\\n20% редкий подарок (11 видов)\\n10% NFT (10 видов)')">📋 Таблица дропов</div>
                <button class="btn-open" data-id="${c.id}">ОТКРЫТЬ</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.btn-open').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                const caseData = CASES.find(c => c.id === id);
                if (caseData) openCase(caseData);
            });
        });
    }

    // Отображение инвентаря в модальном окне (с кнопками ВЫВЕСТИ)
    function renderInventoryModal() {
        const container = document.getElementById('inventoryModalList');
        const user = getUserData();
        container.innerHTML = '';
        // Редкие подарки
        for (const g of RARE_GIFTS) {
            const count = user.inventory[g.id] || 0;
            if (count > 0) {
                const rarityClass = g.rarity === 'common' ? 'rarity-common' : (g.rarity === 'rare' ? 'rarity-rare' : (g.rarity === 'epic' ? 'rarity-epic' : 'rarity-legendary'));
                const rarityName = { common:'Обычный', rare:'Редкий', epic:'Эпический', legendary:'Легендарный' }[g.rarity];
                for (let i=0;i<count;i++) {
                    container.innerHTML += `
                        <div class="gift-card">
                            <div class="gift-info">
                                <div class="gift-icon">${g.icon}</div>
                                <div class="gift-details">
                                    <div class="gift-name">${g.name}</div>
                                    <div><span class="gift-rarity ${rarityClass}">${rarityName}</span></div>
                                    <div class="gift-value">💰 ~${g.valueTon} TON</div>
                                </div>
                            </div>
                            <button class="withdrawFromInventoryBtn" data-gift-type="rare" data-gift-id="${g.id}">ВЫВЕСТИ</button>
                        </div>
                    `;
                }
            }
        }
        // NFT
        user.inventory.nft.forEach((nft, idx) => {
            container.innerHTML += `
                <div class="gift-card">
                    <div class="gift-info">
                        <div class="gift-icon">${nft.icon || '🏷️'}</div>
                        <div class="gift-details">
                            <div class="gift-name">${nft.name}</div>
                            <div><span class="gift-rarity rarity-legendary">NFT</span></div>
                            <div class="gift-value">💰 ${nft.valueTon} TON</div>
                        </div>
                    </div>
                    <button class="withdrawFromInventoryBtn" data-gift-type="nft" data-idx="${idx}">ВЫВЕСТИ</button>
                </div>
            `;
        });
        if (container.innerHTML === '') container.innerHTML = '<div style="padding:20px; text-align:center;">У вас пока нет подарков. Открывайте кейсы или отправляйте подарки в банк!</div>';
        
        // Обработчики кнопок вывода
        document.querySelectorAll('.withdrawFromInventoryBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.getAttribute('data-gift-type');
                if (type === 'rare') {
                    const giftId = btn.getAttribute('data-gift-id');
                    if (user.inventory[giftId] > 0) {
                        user.inventory[giftId]--;
                        saveAllData();
                        alert(`✅ Подарок отправлен в Telegram!`);
                        renderInventoryModal(); // обновляем модалку
                    }
                } else if (type === 'nft') {
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    if (user.inventory.nft[idx]) {
                        user.inventory.nft.splice(idx, 1);
                        saveAllData();
                        alert(`✅ NFT отправлен в Telegram!`);
                        renderInventoryModal();
                    }
                }
            });
        });
    }

    // Пополнение через плюсик (симуляция отправки подарка в банк)
    function showDepositModal() {
        document.getElementById('depositInfoModal').classList.add('active');
    }
    function simulateDeposit() {
        // Симуляция: пользователь отправил подарок в банк, получает баланс и в инвентарь ничего не добавляется,
        // но по заданию: "человек кидает в бота подарок и он появляется в инвентаре" - нужно добавить случайный подарок в инвентарь?
        // Уточним: в задании сказано: "Человек кидает в бота подарок и он появляется в инвентаре". Значит при нажатии "Я отправил" добавляем случайный подарок в инвентарь.
        // Однако ранее было "пополнение баланса", но раз вы хотите чтобы подарок появлялся в инвентаре, то сделаем и то и другое: добавим баланс и подарок.
        const amount = 2.5 + Math.random() * 1.5;
        const rounded = Math.round(amount * 100) / 100;
        addTonToUser(rounded);
        // Добавляем случайный редкий подарок в инвентарь (симуляция того, что пришёл подарок)
        const randomGift = RARE_GIFTS[Math.floor(Math.random() * RARE_GIFTS.length)];
        addRareGiftToUser(randomGift.id);
        alert(`✅ Вам начислен баланс ${rounded} TON и добавлен подарок ${randomGift.icon} ${randomGift.name} в инвентарь!`);
        document.getElementById('depositInfoModal').classList.remove('active');
    }

    // Табы
    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById(`tab${tabId.charAt(0).toUpperCase() + tabId.slice(1)}`).classList.add('active');
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (tabId === 'history') renderHistory();
            });
        });
    }

    function init() {
        loadAllData();
        initCurrentUser();
        renderCases();
        updateBalanceUI();
        initTabs();
        renderHistory();

        document.getElementById('plusBalanceBtn').onclick = showDepositModal;
        document.getElementById('goToBankFromDeposit').onclick = () => window.open('https://t.me/riskgift_bank', '_blank');
        document.getElementById('simulateDepositBtn').onclick = simulateDeposit;
        document.getElementById('closeDepositInfoBtn').onclick = () => document.getElementById('depositInfoModal').classList.remove('active');
        
        // Кнопка инвентаря (отдельная)
        const inventoryModal = document.getElementById('inventoryModal');
        document.getElementById('inventoryMainBtn').onclick = () => {
            renderInventoryModal();
            inventoryModal.classList.add('active');
        };
        document.getElementById('closeInventoryModalBtn').onclick = () => inventoryModal.classList.remove('active');
        
        document.getElementById('closeRouletteBtn').onclick = () => document.getElementById('rouletteModal').classList.remove('active');
        document.getElementById('goToBankBtn').onclick = () => window.open('https://t.me/riskgift_bank', '_blank');
    }
    init();
</script>

</div>
</body>
</html>
