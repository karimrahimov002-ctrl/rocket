<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Case System</title>

<style>
body{
  margin:0;
  background:#0e0e0e;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

h1{margin-top:20px;}

.panel{
  background:#1b1b1b;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

button{
  padding:12px 18px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#4c6fff;
  color:white;
  cursor:pointer;
  font-size:14px;
}

button:hover{background:#3b56d1;}

.case-grid{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.case{
  padding:10px;
  background:#222;
  border-radius:10px;
  cursor:pointer;
}
.case:hover{background:#333;}

.reel{
  width:95%;
  margin:20px auto;
  overflow:hidden;
  border:2px solid #333;
  border-radius:12px;
  position:relative;
  height:140px;
}

.line{
  display:flex;
  transition: transform 4s cubic-bezier(.12,.85,.25,1);
}

.item{
  min-width:140px;
  height:120px;
  margin:10px;
  background:#2a2a2a;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.center{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:2px;
  background:red;
  transform:translateX(-50%);
}

.row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
}

.inv-item{
  background:#2a2a2a;
  padding:8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<h1>🎁 NFT / TON CASE SYSTEM</h1>

<div class="panel">
💰 Баланс: <span id="bal">0</span>
</div>

<div class="panel case-grid">
<div class="case" onclick="setCase('basic')">Basic (5)</div>
<div class="case" onclick="setCase('epic')">Epic (15)</div>
<div class="case" onclick="setCase('legendary')">Legend (30)</div>
</div>

<div class="panel">
<button onclick="spin()">🎰 КРУТИТЬ КЕЙС</button>
<button onclick="withdraw()">📤 ВЫВЕСТИ</button>
</div>

<div class="reel">
<div class="center"></div>
<div class="line" id="line"></div>
</div>

<h3 id="result"></h3>

<div class="panel">
<h3>📦 Инвентарь</h3>
<div class="row" id="inv"></div>
</div>

<script>

const API = window.location.origin;
const uid = localStorage.getItem("uid") || crypto.randomUUID();
localStorage.setItem("uid", uid);

let currentCase = "basic";
let balance = 10;
let inventory = [];

const visuals = [
 "🎁 Gift","💎 NFT","⭐ Rare","🔥 Epic","👑 TON"
];

function setCase(c){
  currentCase = c;
  alert("Выбран кейс: " + c);
}

function render(){
  document.getElementById("bal").innerText = balance;

  const inv = document.getElementById("inv");
  inv.innerHTML = "";

  inventory.forEach(i=>{
    const d = document.createElement("div");
    d.className = "inv-item";
    d.innerText = i.name + " +" + i.value;
    inv.appendChild(d);
  });
}

function buildLine(){
  const line = document.getElementById("line");
  line.innerHTML = "";

  for(let i=0;i<35;i++){
    const el = document.createElement("div");
    el.className = "item";
    el.innerText = visuals[Math.floor(Math.random()*visuals.length)];
    line.appendChild(el);
  }
}

buildLine();

/* ================== SPIN ================== */
async function spin(){

  buildLine();

  const line = document.getElementById("line");
  const blocks = document.querySelectorAll(".item");

  const winIndex = Math.floor(Math.random()*20 + 8);

  blocks[winIndex].innerText = "🎁 WIN NFT";

  const offset = -(winIndex*160 - 140);

  line.style.transform = `translateX(${offset}px)`;

  const res = await fetch(API + "/spin", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id: uid,
      case: currentCase
    })
  });

  const data = await res.json();

  setTimeout(()=>{
    if(data.error){
      document.getElementById("result").innerText = data.error;
      return;
    }

    balance = data.balance;
    inventory = data.inventory;

    document.getElementById("result").innerText =
      "🎉 Выпало: " + data.reward.name;

    render();
  }, 4200);
}

/* ================== WITHDRAW ================== */
async function withdraw(){

  if(inventory.length === 0){
    alert("Нет предметов");
    return;
  }

  const item = inventory[0];

  const res = await fetch(API + "/withdraw", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id: uid,
      item: item
    })
  });

  const data = await res.json();

  alert("Заявка: " + data.status);
}

render();

</script>

</body>
</html>
