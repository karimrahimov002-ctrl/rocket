<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Analytics Dashboard v4.0</title>
    <!-- Подключение иконок -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Подключение библиотеки графиков -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* --- КАРКАС И СТИЛИ (~400 строк) --- */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-purple: #c084fc;
            --accent-red: #f87171;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Боковое меню */
        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--bg-tertiary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .brand {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .menu-group {
            padding: 20px 12px;
        }

        .menu-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
        }

        .menu-item.active {
            border-left: 4px solid var(--accent-blue);
        }

        .user-profile {
            padding: 16px;
            border-top: 1px solid var(--bg-tertiary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Главный контейнер */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 70px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: var(--bg-primary);
            padding: 8px 16px;
            border-radius: 20px;
            width: 300px;
            border: 1px solid var(--bg-tertiary);
        }

        .search-bar input {
            background: none;
            border: none;
            color: var(--text-main);
            margin-left: 10px;
            width: 100%;
            outline: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-badge {
            position: relative;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .icon-badge::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        /* Контентная зона */
        .content-wrapper {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Сетка метрик */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-info .title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .metric-info .value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .metric-info .trend {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trend.up { color: var(--accent-green); }
        .trend.down { color: var(--accent-red); }

        .metric-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        /* Графики и Сетки */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Таблицы */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--bg-tertiary);
            font-size: 0.95rem;
        }

        tr:hover td {
            background-color: rgba(255,255,255,0.02);
        }

        .status {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status.success { background: rgba(74, 222, 128, 0.1); color: var(--accent-green); }
        .status.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .status.failed { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); }

        /* Модуль задач (Заглушка под будущие строки кода) */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: var(--bg-primary);
            border-radius: 8px;
            border-left: 4px solid var(--accent-purple);
        }

        /* Чат / Логи систем */
        .log-console {
            background-color: #050b14;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            color: #4ade80;
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <aside>
        <div>
            <div class="brand">
                <i class="fa-solid to fa-layer-group"></i>
                <span>Nexus Core OS</span>
            </div>
            
            <div class="menu-group">
                <div class="menu-title">Основное</div>
                <a class="menu-item active" data-target="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Дашборд
                </a>
                <a class="menu-item" data-target="analytics">
                    <i class="fa-solid fa-chart-line"></i> Аналитика
                </a>
                <a class="menu-item" data-target="users">
