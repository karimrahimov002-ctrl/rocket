<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Case Bot | Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            color: #eef5ff;
            padding-bottom: 75px;
            min-height: 100vh;
        }

        /* контейнер */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px 12px 80px 12px;
        }

        /* карточки */
        .card {
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            border: 1px solid rgba(72, 187, 255, 0.2);
            padding: 16px;
            margin-bottom: 16px;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* верхняя панель с балансом */
        .balance-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f1629;
            border-radius: 60px;
            padding: 8px 18px;
            margin-bottom: 20px;
            border: 1px solid #2a3a66;
        }
        .balance {
            font-weight: bold;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-sm {
            background: #1f2a48;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sm:active { transform: scale(0.96); background: #2a3a66; }

        /* кейсы сетка */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .case-card {
            background: #111827;
            border-radius: 20px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2d3a5e;
        }
        .case-card:active { transform: scale(0.97); background: #1e2a44; }
        .case-img { font-size: 48px; margin-bottom: 6px; }
        .case-name { font-weight: bold; font-size: 1rem; }
        .case-price { font-size: 0.75rem; opacity: 0.8; margin-top: 4px; }

        /* навигация внизу */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 16, 28, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            padding: 10px 12px 20px;
            border-top: 1px solid #2a3a66;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #8ba0c0;
            transition: 0.1s;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .nav-item.active {
            color: #ffb347;
            background: #1e2a44;
        }

        /* инвентарь таблица/сетка */
        .inventory-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-row {
            background: #0f1629;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid;
        }
        .item-name { font-weight: 600; }
        .item-price { font-size: 0.8rem; opacity: 0.7; }
        button {
            background: #2a3a66;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* анимация открытия */
        .slot-machine {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .slot-items {
            display: flex;
            overflow: hidden;
            width: 260px;
            height: 100px;
            background: #0a0f1e;
            border-radius: 20px;
            position: relative;
        }
        .slot-scroll {
            display: flex;
            animation: scrollSlots 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .slot-item {
            min-width: 100px;
            text-align: center;
            padding: 20px;
            font-size: 2rem;
        }
        @keyframes scrollSlots {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--final-offset)); }
        }
        .win-popup {
            background: #1e2a44;
            padding: 30px;
            border-radius: 40px;
            text-align: center;
            margin-top: 30px;
        }
        .hidden { display: none; }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .badge { 
            background: #1f2a48; 
            padding: 4px 12px; 
            border-radius: 50px; 
            font-size: 12px; 
            cursor: pointer;
        }
        h3 { margin: 16px 0 8px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- верхняя планка -->
    <div class="balance-bar">
        <span>💰 Баланс:</span>
        <span class="balance" id="balanceDisplay">0</span>
        <button class="btn-sm" id="depositBtn">💎 Пополнить</button>
        <button class="btn-sm" id="withdrawBtn">💸 Вывод</button>
    </div>

    <!-- динамические страницы -->
    <div id="mainPage">
        <div class="card">
            <h3>🔥 Последние открытия</h3>
            <div id="recentOpensList">—</div>
        </div>
        <div class="card">
            <h3>⭐ Популярные кейсы</h3>
            <div class="cases-grid" id="popularCases"></div>
        </div>
        <div class="card">
            <h3>🆕 Новые кейсы</h3>
            <div class="cases-grid" id="newCases"></div>
        </div>
        <div class="card" style="display: flex; gap: 12px;">
            <button id="contractsBtn" style="flex:1">📜 Контракты</button>
            <button id="upgradeBtn" style="flex:1">⚡ Улучшение</button>
        </div>
    </div>

    <div id="inventoryPage" style="display:none;">
        <div class="filter-buttons" id="rarityFilter"></div>
        <div id="inventoryList"></div>
        <button id="sellAllBtn" style="margin-top: 12px; background:#c2410c;">🗑️ Продать всё</button>
    </div>

    <div id="casesPage" style="display:none;">
        <input type="text" id="caseSearch" placeholder="🔍 Поиск кейса" style="width:100%; padding:10px; border-radius:30px; margin-bottom:12px; background:#0f1629; border:none; color:white;">
        <div class="cases-grid" id="allCasesList"></div>
    </div>

    <div id="rewardsPage" style="display:none;">
        <div class="card" style="text-align:center">
            <h2>🎁 Ежедневная награда</h2>
            <div id="dailyInfo"></div>
            <button id="claimDailyBtn" class="btn-sm" style="margin-top: 12px;">Забрать</button>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" data-page="main">🏠 Главная</div>
    <div class="nav-item" data-page="cases">📦 Кейсы</div>
    <div class="nav-item" data-page="inventory">📦 Инвентарь</div>
    <div class="nav-item" data-page="rewards">🎁 Награды</div>
    <div class="nav-item" data-page="invite">👥 Пригласить</div>
</div>

<script>
    // ------------------- ДАННЫЕ (локальное хранилище) -------------------
    let userData = {
        balance: 500,
        inventory: [],     // { id, name, price, rarity, emoji, itemDefId }
        nextItemId: 100
    };
    let lastOpens = [];    // последние 10 открытий

    // библиотека всех предметов (определения)
    const ITEM_DEFS = [
        { id: 1, name: "Пистолет-пулемёт", price: 15, rarity: "Common", emoji: "🔫" },
        { id: 2, name: "Бронежилет", price: 30, rarity: "Uncommon", emoji: "🛡️" },
        { id: 3, name: "Штурмовая винтовка", price: 85, rarity: "Rare", emoji: "🔫" },
        { id: 4, name: "Нож-бабочка", price: 210, rarity: "Epic", emoji: "🔪" },
        { id: 5, name: "Снайперская винтовка", price: 520, rarity: "Legendary", emoji: "🎯" },
        { id: 6, name: "Мифический шлем", price: 1250, rarity: "Mythic", emoji: "🪖" },
        { id: 7, name: "Кристалл предков", price: 3100, rarity: "Ancient", emoji: "💎" },
        { id: 8, name: "Космический меч", price: 10200, rarity: "Exclusive", emoji: "⚔️" },
        { id: 9, name: "Золотой слиток", price: 500, rarity: "Legendary", emoji: "🪙" },
        { id: 10, name: "Тайное зелье", price: 80, rarity: "Rare", emoji: "🧪" },
    ];

    // Кейсы (10 штук)
    const CASES = [
        { id: 1, name: "Free 24h", price: 0, category: "free", emoji: "🎁", items: [1,2,3,4] },
        { id: 2, name: "Bronze", price: 50, category: "cheap", emoji: "🥉", items: [1,2,3] },
        { id: 3, name: "Silver", price: 120, category: "cheap", emoji: "🥈", items: [2,3,4] },
        { id: 4, name: "Gold", price: 280, category: "cheap", emoji: "🥇", items: [3,4,5] },
        { id: 5, name: "Emerald", price: 420, category: "cheap", emoji: "💚", items: [3,4,5,6] },
        { id: 6, name: "Dragon", price: 750, category: "mid", emoji: "🐉", items: [4,5,6,7] },
        { id: 7, name: "Neon", price: 890, category: "mid", emoji: "🌈", items: [5,6,7] },
        { id: 8, name: "Diamond", price: 1450, category: "expensive", emoji: "💠", items: [6,7,8] },
        { id: 9, name: "Storm", price: 1750, category: "expensive", emoji: "🌩️", items: [6,7,8] },
        { id: 10, name: "Omega", price: 3200, category: "very_expensive", emoji: "⚫", items: [7,8] },
        { id: 11, name: "Eternal", price: 4800, category: "very_expensive", emoji: "🕰️", items: [7,8] },
        { id: 12, name: "Immortal", price: 7000, category: "very_expensive", emoji: "🏆", items: [8] }
    ];

    // редкости с цветами
    const RARITY_COLORS = {
        "Common": "#8d9bb0",
        "Uncommon": "#5fa03f",
        "Rare": "#4287f5",
        "Epic": "#b440e0",
        "Legendary": "#f5a623",
        "Mythic": "#e85d04",
        "Ancient": "#d4af37",
        "Exclusive": "#ff2a6d"
    };

    // -------------------------------------------------------------
    function saveToLocal() {
        localStorage.setItem('caseBotUser', JSON.stringify({
            balance: userData.balance,
            inventory: userData.inventory,
            nextItemId: userData.nextItemId,
            lastOpens: lastOpens
        }));
    }
    function loadFromLocal() {
        const data = localStorage.getItem('caseBotUser');
        if(data) {
            const parsed = JSON.parse(data);
            userData.balance = parsed.balance;
            userData.inventory = parsed.inventory;
            userData.nextItemId = parsed.nextItemId;
            lastOpens = parsed.lastOpens || [];
        } else {
            // стартовый инвентарь: дадим пару предметов
            userData.inventory = [
                { id: 1, name: "Пистолет-пулемёт", price: 15, rarity: "Common", emoji: "🔫", itemDefId: 1 },
                { id: 2, name: "Нож-бабочка", price: 210, rarity: "Epic", emoji: "🔪", itemDefId: 4 }
            ];
            userData.nextItemId = 100;
            lastOpens = ["Игрок выиграл 🎁 Free 24h → 🔫 Пистолет"];
        }
        updateBalanceUI();
    }

    // вспомогательные функции
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').innerText = userData.balance;
    }

    function addItemToInventory(itemDef) {
        const newItem = {
            id: userData.nextItemId++,
            name: itemDef.name,
            price: itemDef.price,
            rarity: itemDef.rarity,
            emoji: itemDef.emoji,
            itemDefId: itemDef.id
        };
        userData.inventory.push(newItem);
        saveToLocal();
        return newItem;
    }

    function removeItemById(itemId) {
        const index = userData.inventory.findIndex(i => i.id == itemId);
        if(index !== -1) {
            const removed = userData.inventory[index];
            userData.inventory.splice(index,1);
            saveToLocal();
            return removed;
        }
        return null;
    }

    // Открытие кейса с анимацией
    async function openCase(caseObj) {
        if(userData.balance < caseObj.price) {
            alert("Недостаточно монет!");
            return false;
        }
        // Выбор случайного предмета из кейса (равные шансы)
        const possibleItems = caseObj.items.map(itemId => ITEM_DEFS.find(d => d.id == itemId)).filter(i=>i);
        if(possibleItems.length===0) return;
        const randomItem = possibleItems[Math.floor(Math.random() * possibleItems.length)];
        
        // списание баланса
        userData.balance -= caseObj.price;
        updateBalanceUI();
        
        // анимация прокрутки
        await showSlotAnimation(randomItem);
        
        // добавляем в инвентарь
        const newItem = addItemToInventory(randomItem);
        // запись в последние открытия
        const msg = `🎲 ${newItem.name} (${newItem.rarity}) из кейса ${caseObj.name}`;
        lastOpens.unshift(msg);
        if(lastOpens.length > 10) lastOpens.pop();
        saveToLocal();
        
        // модальное окно с результатом
        showWinModal(newItem);
        renderRecentOpens();
        return true;
    }
    
    function showSlotAnimation(item) {
        return new Promise((resolve) => {
            const modal = document.createElement('div');
            modal.className = 'slot-machine';
            modal.innerHTML = `
                <div class="slot-items">
                    <div class="slot-scroll" style="--final-offset: -200px">
                        <div class="slot-item">🎲</div>
                        <div class="slot-item">${item.emoji}</div>
                        <div class="slot-item">✨</div>
                    </div>
                </div>
                <div style="margin-top:20px;color:white;">Выпадает...</div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                modal.remove();
                resolve();
            }, 800);
        });
    }
    
    function showWinModal(item) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'slot-machine';
        modalDiv.innerHTML = `
            <div class="win-popup">
                <div style="font-size:3rem">${item.emoji}</div>
                <h2>${item.name}</h2>
                <p style="color:${RARITY_COLORS[item.rarity] || '#fff'}">${item.rarity}</p>
                <div style="display:flex; gap:12px; margin-top:20px;">
                    <button id="sellWinBtn">💰 Продать за ${item.price}</button>
                    <button id="keepWinBtn">📦 В инвентарь</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const closeModal = () => modalDiv.remove();
        document.getElementById('sellWinBtn').onclick = () => {
            userData.balance += item.price;
            const idx = userData.inventory.findIndex(i=>i.id === item.id);
            if(idx!==-1) userData.inventory.splice(idx,1);
            updateBalanceUI();
            saveToLocal();
            closeModal();
            alert(`+${item.price} монет`);
        };
        document.getElementById('keepWinBtn').onclick = () => {
            closeModal();
        };
    }
    
    function renderRecentOpens() {
        const container = document.getElementById('recentOpensList');
        if(lastOpens.length===0) container.innerText = 'Нет открытий';
        else container.innerHTML = lastOpens.slice(0,5).map(m => `<div>✨ ${m}</div>`).join('');
    }
    
    function renderCasesList(containerId, filter = null) {
        let casesToShow = [...CASES];
        if(filter === 'popular') casesToShow = CASES.slice(0,4);
        else if(filter === 'new') casesToShow = CASES.slice(-4);
        const html = casesToShow.map(c => `
            <div class="case-card" data-case-id="${c.id}">
                <div class="case-img">${c.emoji}</div>
                <div class="case-name">${c.name}</div>
                <div class="case-price">${c.price === 0 ? 'Бесплатно' : c.price + ' 💎'}</div>
            </div>
        `).join('');
        const grid = document.getElementById(containerId);
        if(grid) {
            grid.innerHTML = html;
            grid.querySelectorAll('.case-card').forEach(el => {
                el.addEventListener('click', () => {
                    const caseId = parseInt(el.dataset.caseId);
                    const caseObj = CASES.find(c => c.id === caseId);
                    if(caseObj) openCase(caseObj);
                });
            });
        }
    }
    
    function renderAllCases() {
        const container = document.getElementById('allCasesList');
        if(!container) return;
        container.innerHTML = CASES.map(c => `
            <div class="case-card" data-case-id="${c.id}">
                <div class="case-img">${c.emoji}</div>
                <div class="case-name">${c.name}</div>
                <div class="case-price">${c.price === 0 ? 'Бесплатно' : c.price + ' 💎'}</div>
            </div>
        `).join('');
        document.querySelectorAll('#allCasesList .case-card').forEach(el => {
            el.addEventListener('click', () => {
                const caseId = parseInt(el.dataset.caseId);
                openCase(CASES.find(c=>c.id===caseId));
            });
        });
    }
    
    function renderInventory(filterRarity = null) {
        let inv = [...userData.inventory];
        if(filterRarity && filterRarity !== 'all') inv = inv.filter(i => i.rarity === filterRarity);
        const container = document.getElementById('inventoryList');
        if(!container) return;
        if(inv.length === 0) {
            container.innerHTML = '<div class="card">Инвентарь пуст</div>';
            return;
        }
        container.innerHTML = inv.map(item => `
            <div class="item-row" style="border-left-color: ${RARITY_COLORS[item.rarity] || '#aaa'}">
                <div><span style="font-size:1.5rem">${item.emoji}</span> <span class="item-name">${item.name}</span> <span class="item-price">(${item.price} 💎)</span><br><span style="font-size:0.7rem">${item.rarity}</span></div>
                <button class="sellOneBtn" data-id="${item.id}">Продать</button>
            </div>
        `).join('');
        document.querySelectorAll('.sellOneBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                const item = userData.inventory.find(i=>i.id === id);
                if(item) {
                    userData.balance += item.price;
                    removeItemById(id);
                    updateBalanceUI();
                    renderInventory();
                    alert(`Продано за ${item.price} монет`);
                }
            });
        });
    }
    
    // Контракты: выбор 10 предметов
    let selectedContractItems = [];
    function showContractUI() {
        if(userData.inventory.length < 10) {
            alert("Нужно минимум 10 предметов для контракта!");
            return;
        }
        selectedContractItems = [];
        const modal = document.createElement('div');
        modal.className = 'slot-machine';
        modal.style.overflow = 'auto';
        modal.innerHTML = `
            <div style="background:#0f1629; max-width:90%; border-radius:30px; padding:20px;">
                <h3>📜 Контракт (выберите 10 предметов)</h3>
                <div id="contractInvList" style="max-height:300px; overflow:auto;"></div>
                <button id="doContractBtn" style="margin-top:12px">Обменять</button>
                <button id="closeContractBtn">Отмена</button>
            </div>
        `;
        document.body.appendChild(modal);
        function updateContractList() {
            const container = modal.querySelector('#contractInvList');
            container.innerHTML = userData.inventory.map(it => `
                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #2a3a66;">
                    <span>${it.emoji} ${it.name} (${it.price})</span>
                    <button class="toggleContractBtn" data-id="${it.id}" style="background:${selectedContractItems.includes(it.id) ? '#f97316' : '#2a3a66'}">${selectedContractItems.includes(it.id) ? 'Убрать' : 'Выбрать'}</button>
                </div>
            `).join('');
            modal.querySelectorAll('.toggleContractBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    if(selectedContractItems.includes(id)) selectedContractItems = selectedContractItems.filter(i=>i!==id);
                    else if(selectedContractItems.length < 10) selectedContractItems.push(id);
                    else alert("Максимум 10 предметов");
                    updateContractList();
                });
            });
        }
        updateContractList();
        modal.querySelector('#doContractBtn').onclick = () => {
            if(selectedContractItems.length !== 10) { alert("Выберите ровно 10 предметов"); return; }
            const itemsToRemove = selectedContractItems.map(id => userData.inventory.find(i=>i.id===id));
            const avgPrice = itemsToRemove.reduce((s,i)=>s+i.price,0)/10;
            const newPrice = Math.floor(avgPrice * 1.2);
            let candidates = ITEM_DEFS.filter(i => i.price >= newPrice-100 && i.price <= newPrice+100);
            if(candidates.length===0) candidates = ITEM_DEFS;
            const newItemDef = candidates[Math.floor(Math.random()*candidates.length)];
            for(let id of selectedContractItems) removeItemById(id);
            const newItem = addItemToInventory(newItemDef);
            alert(`Контракт выполнен! Получен ${newItem.name} (${newItem.price} 💎)`);
            modal.remove();
            renderInventory();
        };
        modal.querySelector('#closeContractBtn').onclick = () => modal.remove();
    }
    
    // Улучшение
    function showUpgradeUI() {
        if(userData.inventory.length === 0) { alert("Нет предметов для улучшения"); return; }
        const modal = document.createElement('div');
        modal.className = 'slot-machine';
        modal.innerHTML = `
            <div style="background:#0f1629; border-radius:30px; padding:20px; width:280px;">
                <h3>⚡ Улучшить предмет</h3>
                <select id="upgradeItemSelect"></select>
                <div style="margin:12px 0;">
                    <button class="upgradeMul" data-mul="1.5">x1.5</button>
                    <button class="upgradeMul" data-mul="2">x2</button>
                    <button class="upgradeMul" data-mul="3">x3</button>
                    <button class="upgradeMul" data-mul="5">x5</button>
                    <button class="upgradeMul" data-mul="10">x10</button>
                </div>
                <button id="confirmUpgradeBtn">Улучшить</button>
                <button id="cancelUpgradeBtn">Отмена</button>
            </div>
        `;
        document.body.appendChild(modal);
        const select = modal.querySelector('#upgradeItemSelect');
        userData.inventory.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.text = `${item.emoji} ${item.name} (${item.price})`;
            select.appendChild(opt);
        });
        let selectedMultiplier = 2;
        modal.querySelectorAll('.upgradeMul').forEach(btn => {
            btn.onclick = () => { selectedMultiplier = parseFloat(btn.dataset.mul); };
        });
        modal.querySelector('#confirmUpgradeBtn').onclick = () => {
            const itemId = parseInt(select.value);
            const item = userData.inventory.find(i=>i.id===itemId);
            if(!item) return;
            const chance = 0.5 / selectedMultiplier;
            if(Math.random() < chance) {
                const newPrice = Math.floor(item.price * selectedMultiplier);
                let newDef = ITEM_DEFS.find(d => d.price >= newPrice-50 && d.price <= newPrice+50);
                if(!newDef) newDef = ITEM_DEFS[ITEM_DEFS.length-1];
                removeItemById(item.id);
                const upgraded = addItemToInventory(newDef);
                alert(`Улучшение успешно! Получен ${upgraded.name} (шанс ${Math.round(chance*100)}%)`);
            } else {
                removeItemById(item.id);
                alert(`Неудача! Предмет уничтожен. (шанс ${Math.round(chance*100)}%)`);
            }
            modal.remove();
            renderInventory();
            updateBalanceUI();
        };
        modal.querySelector('#cancelUpgradeBtn').onclick = () => modal.remove();
    }
    
    // Ежедневные награды
    function checkDaily() {
        const lastClaim = localStorage.getItem('dailyLastClaim');
        const today = new Date().toDateString();
        if(lastClaim === today) {
            document.getElementById('dailyInfo').innerHTML = '✅ Вы уже получили награду сегодня! Завтра будет новая.';
            document.getElementById('claimDailyBtn').disabled = true;
        } else {
            let streak = parseInt(localStorage.getItem('dailyStreak') || '0');
            if(lastClaim !== new Date(Date.now()-86400000).toDateString()) streak = 0;
            const rewards = [10,20,50,100,250,500,500];
            const dayIndex = Math.min(streak, 6);
            let rewardAmount = rewards[dayIndex];
            let extra = (streak+1 === 7) ? " + 🔥 Premium Case" : "";
            document.getElementById('dailyInfo').innerHTML = `День ${streak+1} → ${rewardAmount} монет${extra}`;
            document.getElementById('claimDailyBtn').disabled = false;
            document.getElementById('claimDailyBtn').onclick = () => {
                userData.balance += rewardAmount;
                if(streak+1 === 7) {
                    // добавить премиум кейс как предмет
                    const premiumCaseDef = { id:999, name:"Premium Case", price:1500, rarity:"Exclusive", emoji:"🎁" };
                    addItemToInventory(premiumCaseDef);
                }
                updateBalanceUI();
                localStorage.setItem('dailyLastClaim', today);
                localStorage.setItem('dailyStreak', streak+1);
                alert(`+${rewardAmount} монет!`);
                checkDaily();
                saveToLocal();
            };
        }
    }
    
    // навигация
    function showPage(page) {
        document.getElementById('mainPage').style.display = page==='main' ? 'block' : 'none';
        document.getElementById('inventoryPage').style.display = page==='inventory' ? 'block' : 'none';
        document.getElementById('casesPage').style.display = page==='cases' ? 'block' : 'none';
        document.getElementById('rewardsPage').style.display = page==='rewards' ? 'block' : 'none';
        if(page === 'inventory') renderInventory();
        if(page === 'cases') renderAllCases();
        if(page === 'rewards') checkDaily();
        if(page === 'invite') {
            alert("Ваша реферальная ссылка: https://t.me/YourBot?start=ref123 (настройте в реальном боте)");
        }
    }
    
    // Пополнение (мок TON / ЮKassa)
    document.getElementById('depositBtn').onclick = () => {
        alert("💸 Демо-пополнение: +500 монет");
        userData.balance += 500;
        updateBalanceUI();
        saveToLocal();
    };
    document.getElementById('withdrawBtn').onclick = () => alert("Вывод средств — заглушка (реальный API)");
    
    document.getElementById('contractsBtn').onclick = showContractUI;
    document.getElementById('upgradeBtn').onclick = showUpgradeUI;
    document.getElementById('sellAllBtn').onclick = () => {
        const total = userData.inventory.reduce((sum,i)=>sum+i.price,0);
        if(confirm(`Продать все предметы за ${total} монет?`)) {
            userData.balance += total;
            userData.inventory = [];
            updateBalanceUI();
            renderInventory();
            saveToLocal();
        }
    };
    
    // инициализация
    loadFromLocal();
    renderCasesList('popularCases', 'popular');
    renderCasesList('newCases', 'new');
    renderRecentOpens();
    updateBalanceUI();
    
    document.querySelectorAll('.nav-item').forEach(nav => {
        nav.addEventListener('click', () => {
            const page = nav.dataset.page;
            showPage(page);
        });
    });
    showPage('main');
    // фильтры инвентаря (доп)
    const filterDiv = document.getElementById('rarityFilter');
    if(filterDiv) {
        const rarities = [...new Set(ITEM_DEFS.map(i=>i.rarity))];
        filterDiv.innerHTML = `<div class="badge" data-rarity="all">Все</div>` + rarities.map(r=>`<div class="badge" data-rarity="${r}">${r}</div>`).join('');
        filterDiv.querySelectorAll('.badge').forEach(b => {
            b.onclick = () => renderInventory(b.dataset.rarity);
        });
    }
</script>
</body>
</html>
